<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LessonFlow — Platform Admin</title>
<style>
  :root{
    --bg:#0a0a0f; --panel:#14141c; --panel2:#1a1a24; --border:#2a2a38;
    --text:#f0f0f5; --text2:#a0a0b5; --text3:#6a6a80;
    --acc:#7c63f8; --teal:#00d4ad; --red:#ff4f6e; --amber:#ffb040;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Arial,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px;}
  h1{font-size:20px;font-weight:800;margin:0 0 4px;}
  .sub{font-size:12px;color:var(--text3);margin-bottom:20px;}
  input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;width:100%;}
  input:focus{outline:none;border-color:var(--acc);}
  button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;}
  button:hover{border-color:var(--acc);}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
  button.danger{color:var(--red);border-color:rgba(255,79,110,.3);}
  button.danger:hover{background:rgba(255,79,110,.1);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .row:last-child{border-bottom:none;}
  .label{font-size:11px;color:var(--text3);margin-bottom:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);padding:10px 16px;border-radius:8px;font-size:12px;display:none;}
  .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .pill.on{background:rgba(255,176,64,.15);color:var(--amber);}
  .pill.off{background:rgba(0,212,173,.15);color:var(--teal);}
  #login-screen{max-width:380px;margin:80px auto;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tabs button{flex:1;}
  .tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
</style>
</head>
<body>
<div class="wrap">

  <div id="login-screen">
    <h1>🔐 LessonFlow Admin</h1>
    <div class="sub">Platform-level access — not tied to any single school.</div>
    <div class="card">
      <div class="label">Backend URL</div>
      <input id="admin-url" placeholder="https://lessonflow-api-xxxx.railway.app" style="margin-bottom:10px;">
      <div class="label">Admin secret</div>
      <input id="admin-secret" type="password" placeholder="••••••••" style="margin-bottom:12px;" onkeydown="if(event.key==='Enter')adminLogin()">
      <button class="primary" style="width:100%;" onclick="adminLogin()">Unlock →</button>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <h1>🔐 LessonFlow Admin</h1>
      <button onclick="adminLogout()">Log out</button>
    </div>
    <div class="sub">Platform-level access — every school, every account.</div>

    <div class="tabs">
      <button id="tab-schools" class="on" onclick="switchTab('schools')">Schools</button>
      <button id="tab-users" onclick="switchTab('users')">Users</button>
    </div>

    <div id="view-schools"></div>
    <div id="view-users" style="display:none;"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
let ADMIN_URL = '';
let ADMIN_SECRET = '';
let SCHOOLS = [];
let USERS = [];

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function adminHeaders(){
  return {'Content-Type':'application/json', 'X-Admin-Secret': ADMIN_SECRET};
}

async function adminLogin(){
  const url = document.getElementById('admin-url').value.trim();
  const secret = document.getElementById('admin-secret').value;
  if(!url || !secret){ toast('Enter both fields'); return; }
  try{
    const r = await fetch(url.replace(/\/+$/,'') + '/api/admin/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({secret})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Login failed');
    ADMIN_URL = url.replace(/\/+$/,'');
    ADMIN_SECRET = secret;
    sessionStorage.setItem('admin_url', ADMIN_URL);
    sessionStorage.setItem('admin_secret', ADMIN_SECRET);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadSchools();
    loadUsers();
  }catch(e){ toast('❌ ' + e.message); }
}

function adminLogout(){
  sessionStorage.removeItem('admin_url');
  sessionStorage.removeItem('admin_secret');
  ADMIN_URL = ''; ADMIN_SECRET = '';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

function switchTab(tab){
  document.getElementById('tab-schools').classList.toggle('on', tab==='schools');
  document.getElementById('tab-users').classList.toggle('on', tab==='users');
  document.getElementById('view-schools').style.display = tab==='schools' ? 'block' : 'none';
  document.getElementById('view-users').style.display = tab==='users' ? 'block' : 'none';
}

async function loadSchools(){
  const el = document.getElementById('view-schools');
  el.innerHTML = '<div class="card">Loading…</div>';
  try{
    const r = await fetch(ADMIN_URL + '/api/admin/schools', {headers: adminHeaders()});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not load schools');
    SCHOOLS = d.schools;
    renderSchools();
  }catch(e){ el.innerHTML = '<div class="card" style="color:var(--red);">❌ ' + e.message + '</div>'; }
}

function renderSchools(){
  const el = document.getElementById('view-schools');
  if(!SCHOOLS.length){ el.innerHTML = '<div class="card">No schools yet.</div>'; return; }
  el.innerHTML = SCHOOLS.map(s => `
    <div class="card">
      <div class="row" style="border-bottom:none;padding-bottom:0;">
        <div style="flex:1;min-width:200px;">
          <div style="font-size:14px;font-weight:700;">${escapeHtml(s.name)}</div>
          <div style="font-size:11px;color:var(--text3);">Code: ${escapeHtml(s.join_code||'—')} · ${s.user_count} account${s.user_count!==1?'s':''} · created ${new Date(s.created_at).toLocaleDateString('en-GB')}</div>
        </div>
        <span class="pill ${s.paywall_enabled?'on':'off'}">${s.paywall_enabled ? '🔒 Paywall ON' : '✓ Paywall off'}</span>
        <button onclick="togglePaywall('${s.id}', ${!s.paywall_enabled})">${s.paywall_enabled ? 'Turn off' : 'Turn on'}</button>
        <button class="danger" onclick="deleteSchool('${s.id}','${escapeAttr(s.name)}')">Delete school</button>
      </div>
    </div>
  `).join('');
}

async function togglePaywall(schoolId, enabled){
  try{
    const r = await fetch(ADMIN_URL + '/api/admin/school/' + schoolId + '/paywall', {
      method:'PATCH', headers: adminHeaders(), body: JSON.stringify({enabled})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not update paywall');
    toast('✓ Paywall ' + (enabled ? 'enabled' : 'disabled') + ' for ' + d.school.name);
    loadSchools();
  }catch(e){ toast('❌ ' + e.message); }
}

async function deleteSchool(schoolId, name){
  if(!confirm('Delete "' + name + '" and every account in it? This cannot be undone.')) return;
  try{
    const r = await fetch(ADMIN_URL + '/api/admin/school/' + schoolId, {method:'DELETE', headers: adminHeaders()});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not delete school');
    toast('✓ Deleted ' + d.removed.name + ' (' + d.usersRemoved + ' accounts)');
    loadSchools(); loadUsers();
  }catch(e){ toast('❌ ' + e.message); }
}

async function loadUsers(){
  const el = document.getElementById('view-users');
  el.innerHTML = '<div class="card">Loading…</div>';
  try{
    const r = await fetch(ADMIN_URL + '/api/admin/users', {headers: adminHeaders()});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not load users');
    USERS = d.users;
    renderUsers();
  }catch(e){ el.innerHTML = '<div class="card" style="color:var(--red);">❌ ' + e.message + '</div>'; }
}

function renderUsers(){
  const el = document.getElementById('view-users');
  if(!USERS.length){ el.innerHTML = '<div class="card">No accounts yet.</div>'; return; }
  el.innerHTML = '<div class="card">' + USERS.map(u => `
    <div class="row">
      <div style="flex:1;min-width:200px;">
        <div style="font-size:13px;font-weight:600;">${escapeHtml(u.name)} ${u.role==='hod'?'<span class="pill off">HoD</span>':''}</div>
        <div style="font-size:11px;color:var(--text3);">${escapeHtml(u.email)} · ${escapeHtml(u.school_name)} · joined ${new Date(u.created_at).toLocaleDateString('en-GB')}</div>
      </div>
      <button class="danger" onclick="deleteUser('${u.id}','${escapeAttr(u.name)}')">Delete account</button>
    </div>
  `).join('') + '</div>';
}

async function deleteUser(userId, name){
  if(!confirm('Delete ' + name + '\'s account? This cannot be undone.')) return;
  try{
    const r = await fetch(ADMIN_URL + '/api/admin/user/' + userId, {method:'DELETE', headers: adminHeaders()});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Could not delete account');
    toast('✓ Deleted ' + d.removed.name);
    loadUsers(); loadSchools();
  }catch(e){ toast('❌ ' + e.message); }
}

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return String(s||'').replace(/'/g, "\\'"); }

// Restore a session if the secret is still in sessionStorage (cleared on tab close)
(function(){
  const savedUrl = sessionStorage.getItem('admin_url');
  const savedSecret = sessionStorage.getItem('admin_secret');
  if(savedUrl && savedSecret){
    ADMIN_URL = savedUrl; ADMIN_SECRET = savedSecret;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadSchools(); loadUsers();
  } else {
    document.getElementById('admin-url').value = localStorage.getItem('lf_api_url') || '';
  }
})();
</script>
</body>
</html>
