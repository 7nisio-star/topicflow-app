/* ── Trend / sparkline helpers ── */
function recordTrend(cw, score){
  let hist=[];
  try{hist=JSON.parse(localStorage.getItem(TREND_KEY))||[];}catch(e){}
  // Upsert current week
  const existing=hist.findIndex(h=>h.w===cw);
  if(existing>-1) hist[existing].s=score;
  else hist.push({w:cw,s:score});
  // Keep last 10 weeks only
  hist.sort((a,b)=>a.w-b.w);
  if(hist.length>10) hist=hist.slice(-10);
  try{localStorage.setItem(TREND_KEY,JSON.stringify(hist));}catch(e){}
  return hist;
}
function getTrend(){
  try{return JSON.parse(localStorage.getItem(TREND_KEY))||[];}catch(e){return [];}
}
function svgSparkline(hist,w2=80,h2=28){
  if(hist.length<2) return '';
  const vals=hist.map(h=>h.s);
  const min=Math.min(...vals), max=Math.max(...vals);
  const range=Math.max(max-min,10); // min range 10% so flat lines show
  const pts=hist.map((h,i)=>{
    const x=(i/(hist.length-1))*w2;
    const y=h2-((h.s-min)/range)*(h2-4)-2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const lastPt=hist[hist.length-1];
  const lastX=w2, lastY=h2-((lastPt.s-min)/range)*(h2-4)-2;
  const trend=hist.length>=2?hist[hist.length-1].s-hist[hist.length-2].s:0;
  const lineCol=trend>=0?'#00d4ad':'#ff4f6e';
  return `<svg width="${w2}" height="${h2}" style="overflow:visible;">
    <polyline points="${pts}" fill="none" stroke="${lineCol}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>

/* ════ DRAG ════ */
let DRAG=null;
function attachBars(){
  // New gantt uses data-bar attribute (not .gbar class)
  document.querySelectorAll('[data-bar="1"]').forEach(b=>{
    b.removeEventListener('mousedown',_bd);
    b.addEventListener('mousedown',_bd);
  });
}
function _bd(e){
  const bar=e.currentTarget||this;
  const name=bar.dataset.name||bar.dataset.t, tid=bar.dataset.tid||bar.dataset.id, clsId=bar.dataset.cls||bar.dataset.c;
  const cls=getCls(clsId); if(!cls) return;
  if(name!==U){openDp(name,tid,cls);return;}
  e.preventDefault();e.stopPropagation();
  const topic=cls.topics.find(t=>t.id===tid);if(!topic)return;
  const handle=e.target.dataset?.handle;
  const rect=bar.getBoundingClientRect(), rx=e.clientX-rect.left, bw=rect.width, H=10;
  const mode=handle==='l'?'rl':handle==='r'?'rr':rx<=H?'rl':rx>=bw-H?'rr':'mv';
  const p=gp(name,tid);
  const as=p.actualStart||topic.start, ae=p.actualEnd||topic.end;
  DRAG={bar,name,tid,cls,topic,mode,origStart:as,origEnd:ae,span:ae-as,startX:e.clientX};
  bar.classList.add('dragging');
  document.addEventListener('mousemove',_dm);
  document.addEventListener('mouseup',_du);
}
function _dm(e){
  if(!DRAG)return;
  const dw=Math.round((e.clientX-DRAG.startX)/WPX);
  const {name,tid,topic,mode,origStart,origEnd,span}=DRAG;
  const p=gp(name,tid);
  let ns=origStart,ne=origEnd;
  if(mode==='mv'){ns=Math.max(1,Math.min(origStart+dw,PD.weeks-span));ne=ns+span;}
  else if(mode==='rr'){ne=Math.max(origStart+1,Math.min(origEnd+dw,PD.weeks));}
  else{ns=Math.max(1,Math.min(origStart+dw,origEnd-1));}
  p.actualStart=ns;p.actualEnd=ne;
  const win=scopeWindow();
  DRAG.bar.style.left=((ns-win.from)*WPX+3)+'px';
  DRAG.bar.style.width=Math.max((ne-ns+1)*WPX-6,24)+'px';
  var _dt=document.getElementById('drag-tip');
  if(_dt){_dt.textContent='W'+ns+'–W'+ne+' ('+(ne-ns+1)+'w)';_dt.style.display='block';_dt.style.left=(e.clientX+14)+'px';_dt.style.top=(e.clientY-30)+'px';}
  const wd=DRAG.bar.querySelector('.bdur');if(wd)wd.textContent=(ne-ns+1)+'w';
  const pw=topic.end-topic.start+1,aw=ne-ns+1,d=aw-pw;
  showTip(e,`<strong>${topic.name}</strong><br>W${ns}\u2013W${ne} \u00b7 ${aw}w<br>${d===0?'On plan':d>0?`<span style="color:var(--red)">+${d}w over</span>`:`<span style="color:var(--teal)">${d}w under</span>`}`);
}
function _du(){
  document.removeEventListener('mousemove',_dm);
  document.removeEventListener('mouseup',_du);
  hideTip();
  if(!DRAG)return;
  const _dtip=document.getElementById('drag-tip');if(_dtip)_dtip.style.display='none';
  DRAG.bar.classList.remove('dragging');
  const p=gp(DRAG.name,DRAG.tid);
  if(p.status==='none'&&p.actualStart) p.status='progress';
  _pushUndo();
  // Auto-ripple: if bar now ends later than planned, offer to shift future topics
  const dragCls=DRAG.cls, dragName=DRAG.name, dragTopic=DRAG.topic;
  const newEnd=p.actualEnd||dragTopic.end;
  const overrun=newEnd-dragTopic.end;
  DRAG=null; savT(); renderGanttSection();
  if(overrun>0&&dragName===U){
    const future=dragCls.topics.filter(function(t){return t.start>dragTopic.end;});
    if(future.length){
      setTimeout(function(){
        const msg='This topic runs '+overrun+'w over plan. Shift '+future.length+' future topic'+(future.length>1?'s':'')+' forward by '+overrun+'w?';
        if(confirm(msg)){
          _pushUndo();
          future.forEach(function(t){
            t.start+=overrun;
            t.end+=overrun;
            var fp=gp(dragName,t.id);
            delete fp.actualStart;
            delete fp.actualEnd;
          });
          savT();savC();renderGanttSection();
          showToast('\u21aa '+future.length+' topics shifted +'+overrun+'w');
        }
      },150);
    }
  }
}

function _pushUndo(){
  _undoStack.push(JSON.stringify(T));
  if(_undoStack.length>40)_undoStack.shift();
  _redoStack=[];
}
function savNote(name,tid,text){
  if(!T[name]) return;

  T[name].notes[tid]=text.trim();
  savT();
}

function getTeacherLoad(name, week){
  // Count how many distinct topic-weeks land on this week across all classes
  let load=0;
  allCls().forEach(cls=>{
    if(T[name]&&(getAssign()[name]||[cls.id]).includes(cls.id)){
      cls.topics.forEach(t=>{
        if(t.start<=week&&t.end>=week) load++;
      });
    }
  });
  return load;
}

function renderAlertsPanel(){
  const panel=document.getElementById('alert-panel');
  if(!panel) return;
  const alerts=computeAlerts();
  if(!alerts.length){
    panel.innerHTML='<div style="font-size:12px;color:var(--teal);text-align:center;padding:8px;">✓ No issues right now 🎉</div>';
    return;
  }
  panel.innerHTML=`<div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;">Live alerts</div>`+
    alerts.map(a=>`<div onclick="${a.action||''};document.getElementById('alert-panel').style.display='none';"
      style="padding:7px 9px;border-radius:8px;margin-bottom:5px;cursor:pointer;
        background:${a.type==='red'?'rgba(255,79,110,.1)':'rgba(255,176,64,.08)'};
        border:1px solid ${a.type==='red'?'rgba(255,79,110,.2)':'rgba(255,176,64,.18)'};
        font-size:12px;color:${a.type==='red'?'var(--red)':'var(--amber)'};">
        ${a.icon} ${a.text}
      </div>`).join('');
}
function updateAlertBell(){
  const alerts=computeAlerts();
  const cnt=document.getElementById('alert-count');
  if(!cnt) return;
  const n=alerts.filter(a=>a.type==='red').length;
  cnt.textContent=n;
  cnt.style.display=n>0?'block':'none';
}

/* ══════════════════════════════════════════════════════════
   ONE-CLICK HOD ACTIONS
══════════════════════════════════════════════════════════ */
function fixAlignment(){
  if(!isHoD()){showToast('HoD only action.');return;}
  const cw=getEffectiveWeek();
  if(!confirm(`Align all teachers to Week ${cw}? This marks the current topic as "In progress" for everyone.`)) return;
  _pushUndo();
  Ts().forEach(name=>{
    if(!T[name]) return;
    allCls().forEach(cls=>{
      cls.topics.forEach(topic=>{
        if(topic.start<=cw&&topic.end>=cw){
          if(!T[name].progress) T[name].progress={};
          const existing=T[name].progress[topic.id]||{};
          T[name].progress[topic.id]={...existing, status:'progress', actualStart:cw};
        }
      });
    });
  });
  savT(); showToast('⚡ Department aligned to Week '+cw); render();
}

function bringAllToCurrent(){
  if(!isHoD()){showToast('HoD only.');return;}
  const cw=getEffectiveWeek();
  if(!confirm(`Mark all topics up to Week ${cw} as taught for everyone?`)) return;
  _pushUndo();
  Ts().forEach(name=>{
    if(!T[name]) return;
    allCls().forEach(cls=>{
      cls.topics.filter(t=>t.end<cw).forEach(t=>{
        if(!T[name].progress) T[name].progress={};
        const p=T[name].progress[t.id]||{};
        if(p.status!=='taught') T[name].progress[t.id]={...p,status:'taught'};
      });
    });
  });
  savT(); showToast('All past topics marked taught.'); render();
}

function toggleTheme(){
  THEME=THEME==='dark'?'light':'dark';
  document.body.classList.toggle('light',THEME==='light');
  localStorage.setItem('lf_theme',THEME);
  showToast(THEME==='light'?'☀ Light mode':'🌙 Dark mode');
}
function undoAction(){
  if(!_undoStack.length){showToast('Nothing to undo');return;}
  _redoStack.push(JSON.stringify(T));
  T=JSON.parse(_undoStack.pop());
  savT();renderGanttSection();showToast('↩ Undone');
}
function redoAction(){
  if(!_redoStack.length){showToast('Nothing to redo');return;}
  _undoStack.push(JSON.stringify(T));
  T=JSON.parse(_redoStack.pop());
  savT();renderGanttSection();showToast('↪ Redone');
}

/* ════════════════════════════════════
   CORE GANTT RENDER
   Shows the scoped window of weeks
   with each teacher as a row
════════════════════════════════════ */
function renderGanttSection(){
  const co=document.getElementById('content');
  if(!co) return;
  const cls=getCls(YID);
  if(!cls){co.innerHTML='';return;}

  const cw=getCW();
  // Show FULL 40-week timeline — always, scroll to today
  const from=1, to=PD.weeks, TW=to*WPX;
  const nowTpc=topicAt(cls,cw);
  const nowTopic=nowTpc;

  // Row height scales to fill screen
  const _avail=Math.max(200,window.innerHeight-240);
  const rowCount=cls.topics.length;
  const dynRH=Math.min(Math.max(40,Math.floor(_avail/Math.min(rowCount,15))),90);
  const dynBarH=Math.max(18,Math.round(dynRH*0.44));

  // Scope label
  const scopeLabels={
    this:`Week ${cw} \u00b7 ${wLabel(cw)}${nowTpc?' \u00b7 '+nowTpc.name:''}`,
    prev:`Week ${cw-1} \u00b7 ${wLabel(cw-1)}`,
    next:`Week ${cw+1} \u00b7 ${wLabel(cw+1)}`,
    should:nowTpc?`\u2714 Should be on: ${nowTpc.name} (W${nowTpc.start}\u2013${nowTpc.end})`:'No topic this week'
  };
  document.getElementById('scope-label').textContent=scopeLabels[SCOPE]||'';

  const wks=Array.from({length:to},(_,i)=>i+1);
  const tn=viewTs(cls.id);

  /* Month label blocks */
  const months={};
  wks.forEach((w,i)=>{
    const ms=wMonthStr(w);
    if(!months[ms]) months[ms]={start:i,count:0};
    months[ms].count++;
  });
  const mblocks=Object.entries(months).map(([m,v])=>`
    <div class="mblk" style="left:${v.start*WPX}px;width:${v.count*WPX}px;">
      <span class="ml">${m}</span>
    </div>`).join('');

  /* Date column headers — virtual: only render visible + 5 buffer columns */
  const _gs=document.getElementById('gscroll');
  const _scrollL=_gs?_gs.scrollLeft:0;
  const _vpW=_gs?_gs.clientWidth:800;
  const _firstVis=Math.max(0,Math.floor(_scrollL/WPX)-2);
  const _lastVis=Math.min(wks.length-1,Math.ceil((_scrollL+_vpW)/WPX)+2);
  const dcols=wks.map((w,i)=>{
    if(i<_firstVis||i>_lastVis) return `<div style="position:absolute;left:${i*WPX}px;width:${WPX}px;height:34px;pointer-events:none;"></div>`;
    const isToday=w===cw;
    return `<div class="dcol${isToday?' today':''}"
      style="left:${i*WPX}px;width:${WPX}px;cursor:col-resize;user-select:none;"
      data-col-resize="1"
      title="Drag to resize column width">
      <span class="dn" style="${isToday?'color:var(--today);font-weight:800;':''}">${wDayNum(w)}</span>
      <span class="dd">${wDayName(w)}</span>
    </div>`;
  }).join('');

  /* Grid column backgrounds (no today marker here — done as overlay) */
  const gcols=wks.map((w,i)=>{
    const isToday=w===cw;
    return `<div class="gcol${isToday?' today-bg':''}"
      style="left:${i*WPX}px;width:${WPX}px;pointer-events:none;"></div>`;
  }).join('');

  /* Today line — single overlay, NOT per-row */
  const todayX=Math.round((cw-1)*WPX+WPX/2);
  const nowOverlay=`<div class="now-line" style="left:${todayX}px;z-index:20;">
    <div class="now-pill">W${cw} · ${wLabel(cw,'short')}</div>
  </div>`;

  /* Build topic rows */
  const leftRows=[], rightRows=[];
  // Virtual row rendering: only fully render visible rows ± 3 buffer
  const _gsEl=document.getElementById('gscroll');
  const _scrollTop=_gsEl?_gsEl.scrollTop:0;
  const _vpH=_gsEl?_gsEl.clientHeight:600;
  const _firstVisRow=Math.max(0,Math.floor(_scrollTop/dynRH)-3);
  const _lastVisRow=Math.min(cls.topics.length-1,Math.ceil((_scrollTop+_vpH)/dynRH)+3);

  cls.topics.forEach((topic,ti)=>{
    // Off-screen rows: emit height-preserving placeholder (keeps scrollbar correct)
    if(ti<_firstVisRow||ti>_lastVisRow){
      leftRows.push(`<div role="row" style="height:${dynRH}px;flex-shrink:0;border-bottom:1px solid var(--border);background:transparent;"></div>`);
      rightRows.push(`<div role="gridcell" class="trow" style="height:${dynRH}px;width:${TW}px;"></div>`);
      return;
    }
    const isNow=topic.start<=cw&&topic.end>=cw;
    const isPast=topic.end<cw;
    const isShould=SCOPE==='should'&&nowTpc&&nowTpc.id===topic.id;
    const myP=U?gp(U,topic.id):{status:'none'};
    const mySts=myP.status||'none';
    const taughtCount=tn.filter(n=>T[n]?.progress?.[topic.id]?.status==='taught').length;
    const statusIcon=(()=>{
      if(mySts==='taught') return '<span style="color:var(--teal);">✓</span>';
      if(mySts==='progress') return isPast
        ?'<span style="color:var(--amber);font-size:10px;">⏱</span>'   // overdue in progress
        :'<span style="color:var(--amber);">→</span>';
      if(isPast) return '<span style="color:var(--red);">⚠</span>';     // overdue not started
      if(isNow)  return '<span style="color:var(--acc);font-size:9px;">▶</span>'; // current
      return '<span style="color:var(--text3);font-size:9px;opacity:.4;">○</span>'; // future
    })();
    const intFlag=isIntervention(cls.id,topic.id)?'<span class="int-badge" title="Flagged for intervention">📌</span>':''
    const _isFutureRow=topic.start>cw;
    const rowBg=isNow
      ?'rgba(108,86,245,.06)'                      // current week — subtle accent
      :isPast&&mySts!=='taught'
        ?'rgba(255,79,110,.04)'                    // past not taught — faint red
        :isPast
          ?'rgba(0,0,0,.0)'                        // past taught — neutral
          :'rgba(255,255,255,.01)';                // future — near-invisible
    const fz=Math.max(11,Math.min(13,Math.round(dynRH*0.17)));

    leftRows.push(`<div role="row" aria-label="${topic.name} Week ${topic.start} to ${topic.end}" tabindex="0"
      onkeydown="(function(e){if(e.key==='ArrowDown'){e.preventDefault();const rows=document.querySelectorAll('#gleft [role=row]');const i=Array.from(rows).indexOf(e.currentTarget);if(rows[i+1])rows[i+1].focus();}if(e.key==='ArrowUp'){e.preventDefault();const rows=document.querySelectorAll('#gleft [role=row]');const i=Array.from(rows).indexOf(e.currentTarget);if(rows[i-1])rows[i-1].focus();}if(e.key==='Enter'||e.key===' '){e.preventDefault();openDp('${escAttr(U||Ts()[0]||'')}','${topic.id}',getCls('${escAttr(cls.id)}'));}})(event)"
      style="height:${dynRH}px;display:flex;align-items:center;
      padding:0 8px 0 10px;border-bottom:1px solid var(--border);gap:6px;
      flex-shrink:0;background:${rowBg};">
      <span style="font-size:10px;color:var(--text3);font-weight:700;width:18px;
        text-align:right;flex-shrink:0;">${ti+1}</span>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:4px;overflow:hidden;">
          ${(()=>{const st=getTopicStrand(cls.id,topic.id);return st?`<span style="width:7px;height:7px;border-radius:50%;background:${st.color};flex-shrink:0;" title="${escAttr(st.name)}"></span>`:''})()}
          <div style="font-size:${fz}px;font-weight:${isNow?700:500};overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap;
            color:${isPast&&mySts!=='taught'?'var(--red)':topic.start>cw?'var(--text3)':isNow?'var(--text)':'var(--text)'};"
            title="${topic.name}">${topic.name}</div>
        </div>
        ${dynRH>52?`<div style="font-size:10px;color:var(--text3);margin-top:1px;">W${topic.start}–${topic.end} · ${topic.end-topic.start+1}w${isHoD()&&tn.length>1?' · '+taughtCount+'/'+tn.length+' ✓':''}</div>`:''}
        ${(()=>{if(!U||dynRH<60) return '';const ld=getTeacherLoad(U,getEffectiveWeek());if(!isNow||ld===0) return '';const lc=ld>=3?'var(--red)':ld===2?'var(--amber)':'var(--teal)';return '<div style="font-size:9px;color:'+lc+';margin-top:1px;font-weight:600;">Load: '+ld+'</div>';})()}
      </div>
      <span style="font-size:11px;flex-shrink:0;">${intFlag}${statusIcon}</span>
    </div>`);

    /* Ghost planned bar */
    const px=(topic.start-1)*WPX+2, pw=Math.max((topic.end-topic.start+1)*WPX-4,8);
    const _ghostCol=isPast?'rgba(255,79,110,.2)':isNow?'rgba(108,86,245,.15)':'rgba(255,255,255,.04)';
    const _ghostBdr=isPast?'rgba(255,79,110,.3)':isNow?'rgba(108,86,245,.3)':'rgba(255,255,255,.14)';
    const ghostBar=`<div style="position:absolute;top:50%;transform:translateY(-50%);
      left:${px}px;width:${pw}px;height:${dynBarH+6}px;border-radius:6px;
      background:${_ghostCol};border:2px dashed ${_ghostBdr};
      pointer-events:none;z-index:2;"></div>`;

    /* Should-be highlight */
    const shouldHL=isShould?`<div style="position:absolute;left:${px-2}px;top:0;bottom:0;
      width:${pw+4}px;background:rgba(108,86,245,.09);
      border-left:2px solid var(--acc);border-right:2px solid var(--acc);
      pointer-events:none;z-index:1;">
      <div style="position:absolute;bottom:2px;left:4px;font-size:8px;color:var(--acc);font-weight:700;">✔ plan</div>
    </div>`:'';

    /* Teacher bars */
    let bars='';
    if(tn.length>0){
      const nT=tn.length;
      const stripH=Math.max(6,Math.floor(dynBarH/nT));
      const totalH=stripH*nT;
      const topOff=Math.round((dynRH-totalH)/2);
      tn.forEach((name,ni)=>{
        const pp=T[name]?.progress?.[topic.id]||{};
        const sts=pp.status||'none';
        const isMe=name===U;
        if(sts==='none'&&!isMe) return;
        const as_=pp.actualStart||topic.start, ae_=pp.actualEnd||topic.end;
        const bx=(as_-1)*WPX+2, bw=Math.max((ae_-as_+1)*WPX-4,12);
        const by=topOff+ni*stripH, bh=Math.max(stripH-2,4);
        const _isNowBar=topic.start<=cw&&topic.end>=cw;
        const _isFutureBar=topic.start>cw;
        const bg=(()=>{
          if(sts==='taught') return _isFutureBar?'rgba(0,212,173,.35)':cls.color;
          if(sts==='progress'){
            if(isPast) return 'rgba(255,140,0,.75)';   // overdue in progress — amber
            if(_isNowBar) return cls.color+'dd';        // current — vivid
            return cls.color+'55';                      // future started early — dim
          }
          // none/missed
          if(sts==='missed'||isPast) return 'rgba(255,79,110,.25)';    // overdue missed — muted red
          if(_isNowBar) return cls.color+'33';         // current not started — very dim class colour
          return 'rgba(255,255,255,.05)';              // future — barely there
        })();
        const ghost=!isHoD()&&TEAM_VIEW&&!isMe?'opacity:.28;filter:saturate(.3);':'';
        const eName=escAttr(name), eTopic=escAttr(topic.name);
        bars+=`<div data-bar="1" data-name="${escAttr(name)}" data-tid="${topic.id}" data-cls="${cls.id}"
          data-as="${as_}" data-ae="${ae_}" data-ps="${topic.start}" data-pe="${topic.end}" data-sts="${sts}"
          aria-label="${sts==='taught'?'Taught':sts==='progress'?'In progress':'Not started'}: ${topic.name}, ${name}"
          tabindex="0"
          onkeydown="if(event.key==='Enter'||event.key===' ')openDp('${escAttr(name)}','${topic.id}',getCls('${escAttr(cls.id)}'))"
          style="position:absolute;left:${bx}px;top:${by}px;width:${bw}px;height:${bh}px;
            border-radius:${Math.min(4,Math.round(bh/2))}px;background:${bg};${ghost}
            z-index:${isMe?6:3};cursor:pointer;overflow:hidden;display:flex;align-items:center;
            box-shadow:${sts==='taught'?'0 1px 5px rgba(0,0,0,.4)':'none'};"
          onmouseenter="showBarTip(event,'${eTopic}','${eName}',${as_},${ae_},${topic.end-topic.start+1},'${sts}')"
          onmouseleave="hideTip()"
          onclick="openDp('${escAttr(name)}','${topic.id}',getCls('${cls.id}'))">
          ${isMe&&bh>6?`<span data-handle="l" style="position:absolute;left:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:7;"></span>`:''}
          ${bh>8&&bw>36?`<span style="font-size:9px;color:rgba(255,255,255,.85);padding-left:${isMe?10:5}px;white-space:nowrap;overflow:hidden;pointer-events:none;">${sts==='taught'?'✓ ':sts==='progress'?'→ ':''}${isMe?'you':ini(name)}</span>`:''}
          ${isMe&&bh>6?`<span data-handle="r" style="position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:7;"></span>`:''}
        </div>`;
      });
    }

    rightRows.push(`<div role="gridcell" class="trow" style="height:${dynRH}px;width:${TW}px;background:${rowBg};">
      ${gcols}${shouldHL}${ghostBar}${bars}
    </div>`);
  });

  // Filler
  leftRows.push(`<div class="gbody-filler"></div>`);
  rightRows.push(`<div class="gbody-filler" style="width:${TW}px;">${gcols}</div>`);

  /* Action banner */
  let actionBanner='';
  if(U&&T[U]){
    const myBehind=wksBehind(U,cls,cw);
    const myAhead=wksAhead(U,cls,cw);
    const nextTopic=nowTopic?cls.topics[cls.topics.indexOf(nowTopic)+1]:cls.topics.find(t=>t.start>cw);
    const myOd=cls.topics.filter(t=>t.end<cw&&T[U]?.progress?.[t.id]?.status!=='taught').length;
    let bg2='',bd='',icon2='',title2='',body2='',cta2='';
    if(myBehind>0||myOd>0){
      bg2='rgba(255,79,110,.06)';bd='rgba(255,79,110,.25)';icon2='⚠️';
      title2=myBehind>0?`${myBehind}w behind plan`:`${myOd} topic${myOd>1?'s':''} overdue`;
      body2=myOd>0?`Consider combining <strong>${cls.topics.find(t=>t.end<cw&&T[U]?.progress?.[t.id]?.status!=='taught')?.name||'overdue topics'}</strong> with your next lesson.`:'Focus on closing the gap before Week '+(cw+3)+'.';
      cta2=`<button onclick="setView('behind')" class="btn" style="font-size:11px;border-color:var(--red);color:var(--red);margin-top:6px;">View catch-up plan →</button>`;
    } else if(myAhead>0){
      bg2='rgba(0,212,173,.05)';bd='rgba(0,212,173,.2)';icon2='🔥';
      title2=`${myAhead}w ahead`;
      body2=nextTopic?`Next: <strong>${nextTopic.name}</strong> (W${nextTopic.start}). Use time for retrieval practice.`:'Ahead — great time for gap lessons.';
    } else if(nowTopic){
      const p2=gp(U,nowTopic.id);
      if(p2.status==='none'){
        bg2='rgba(108,86,245,.06)';bd='rgba(108,86,245,.2)';icon2='▶️';
        title2=`Start: ${nowTopic.name}`;
        body2=`Planned W${nowTopic.start}–${nowTopic.end}.`;
        cta2=`<button onclick="setSts('${U.replace(/'/g,"\\'")}','${nowTopic.id}','progress')" class="btna btn" style="font-size:11px;margin-top:6px;">Mark in progress</button>`;
      } else if(p2.status==='progress'){
        bg2='rgba(255,176,64,.05)';bd='rgba(255,176,64,.2)';icon2='→';
        title2=`In progress: ${nowTopic.name}`;
        body2=nextTopic?`Next up: <strong>${nextTopic.name}</strong>.`:'Currently teaching.';
        cta2=`<button onclick="setSts('${U.replace(/'/g,"\\'")}','${nowTopic.id}','taught')" class="btn" style="font-size:11px;border-color:var(--teal);color:var(--teal);margin-top:6px;">✓ Mark as taught</button>`;
      }
    }
    if(title2) actionBanner=`<div style="margin:6px 12px 0;padding:9px 12px;background:${bg2};border:1px solid ${bd};border-radius:9px;flex-shrink:0;display:flex;align-items:flex-start;gap:8px;">
      <span style="font-size:15px;flex-shrink:0;">${icon2}</span>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:600;">${title2}</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.5;">${body2}</div>
        ${cta2}
      </div>
    </div>`;
  }

  const html=`<div id="gwrap">
    ${actionBanner}
    <div id="dhead" style="margin-top:${actionBanner?'6':'0'}px;">
      <div class="dh-stub">
        <span style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);flex:1;"># TOPIC</span>
        <span style="font-size:9px;color:var(--text3);">ST</span>
      </div>
      <div class="dh-dates" id="ghscroll">
        <div class="mrow" style="width:${TW}px;">${mblocks}</div>
        <div class="drow" style="width:${TW}px;">${dcols}</div>
      </div>
    </div>

    <div id="gbody" role="grid" aria-label="${cls.name} curriculum gantt">
      <div id="gleft" role="rowgroup" style="overflow-y:hidden;min-height:100%;display:flex;flex-direction:column;">
        ${leftRows.join('')}
      </div>

/* ── Column resize drag ── */
let _colDrag=null;
function attachColResize(){
  const ghscroll=document.getElementById('ghscroll');
  if(!ghscroll) return;
  ghscroll.addEventListener('mousedown',e=>{
    const col=e.target.closest('[data-col-resize]');
    if(!col) return;
    e.preventDefault();
    _colDrag={startX:e.clientX,startWPX:WPX};
    document.addEventListener('mousemove',_onColDrag);
    document.addEventListener('mouseup',_offColDrag);
  });
}
function _onColDrag(e){
  if(!_colDrag) return;
  const delta=e.clientX-_colDrag.startX;
  const newW=Math.max(24,Math.min(100,_colDrag.startWPX+Math.round(delta/1)));
  if(newW!==WPX){
    // WPX is const — use a mutable shadow
    WPX=newW;
    renderGanttSection();
  }
}
function _offColDrag(){
  _colDrag=null;
  document.removeEventListener('mousemove',_onColDrag);
  document.removeEventListener('mouseup',_offColDrag);
}

function syncSc(el){
  const gl=document.getElementById('gleft');
  if(gl) gl.scrollTop=el.scrollTop;
  const gh=document.getElementById('ghscroll');
  if(gh&&gh.scrollLeft!==el.scrollLeft) gh.scrollLeft=el.scrollLeft;
  // Save position for post-render restoration
  el._savedScrollTop=el.scrollTop;
  el._savedScrollLeft=el.scrollLeft;
  // No full re-render on scroll — eliminates flicker.
  // Virtual rows are rebuilt only when VIEW changes or data changes.
}

/* ════════════════════════════════════════════════════════
   1. SMART ALERTS ENGINE
════════════════════════════════════════════════════════ */
function computeAlerts(){
  const cw=getCW(), classes=allCls(), tn=Ts();
  const alerts=[];

  classes.forEach(cls=>{
    const atRisk=tn.filter(n=>wksBehind(n,cls,cw)>=2);
    const overdue=tn.filter(n=>cls.topics.some(t=>t.end<cw&&T[n]?.progress?.[t.id]?.status!=='taught'));
    const overdueNoNote=overdue.filter(n=>!Object.values(T[n]?.notes||{}).some(v=>v.trim()));
    const misaligned=tn.length>=2&&(()=>{
      const pcts=tn.map(n=>pct(n,cls));
      return Math.max(...pcts)-Math.min(...pcts)>15;
    })();

    if(atRisk.length>=2)
      alerts.push({type:'red',icon:'⚠',text:`${atRisk.length} teachers 2w+ behind in ${cls.name}`,cls:cls.id,action:`goY('${cls.id}');setView('behind')`});
    else if(atRisk.length===1)
      alerts.push({type:'amber',icon:'⚠',text:`${atRisk[0]} behind in ${cls.name}`,cls:cls.id,action:`goY('${cls.id}');setView('behind')`});

    if(overdueNoNote.length)
      alerts.push({type:'red',icon:'📌',text:`${overdueNoNote.length} overdue topic${overdueNoNote.length>1?'s':''} with no note in ${cls.name}`,cls:cls.id,action:`goY('${cls.id}');setView('behind')`});

    if(misaligned)
      alerts.push({type:'amber',icon:'↔',text:`${cls.name} misaligned >15% across teachers`,cls:cls.id,action:`goY('${cls.id}')`});
  });

  // Upcoming collision — topic ending same week another starts
  const nowT=allCls().flatMap(c=>c.topics.filter(t=>t.start===cw||t.end===cw));
  if(nowT.length>=3)
    alerts.push({type:'blue',icon:'⏰',text:`${nowT.length} topics changing this week`,action:'DASH=true;render()'});

  return alerts;
}

function renderAlertBar(container){
  const alerts=computeAlerts();
  const existing=document.getElementById('alert-bar');
  if(existing) existing.remove();
  if(!alerts.length) return;
  const bar=document.createElement('div');
  bar.id='alert-bar';bar.className='alert-bar';
  bar.innerHTML=`<span style="font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--red);flex-shrink:0;text-transform:uppercase;">Alerts</span>`+
    alerts.map(a=>`<div class="alert-chip ${a.type}" onclick="${a.action};renderAlertBar(document.getElementById('right-panel'))" title="${a.text}">${a.icon} ${a.text}</div>`).join('');
  container.prepend(bar);
}

/* ════════════════════════════════════════════════════════
   2. CATCH-UP INTELLIGENCE
════════════════════════════════════════════════════════ */
function smartCatchup(name, cls){
  if(!T[name]) return;
  const cw=getCW(), behind=wksBehind(name,cls,cw);
  if(behind<=0){showToast('No catch-up needed — on track!');return;}

  const remaining=cls.topics.filter(t=>T[name]?.progress?.[t.id]?.status!=='taught'&&t.start>=cw);
  if(!remaining.length){showToast('All future topics already marked taught.');return;}

  // Intelligence: categorise topics by priority (shorter = lower priority)
  const suggestions=[];
  let weeksSaved=0;

  remaining.forEach((t,i)=>{
    const dur=t.end-t.start+1;
    const next=remaining[i+1];
    // Can merge if consecutive and both short
    if(next&&dur===1&&(next.end-next.start+1)===1&&weeksSaved<behind){
      suggestions.push({type:'merge',text:`Combine "${t.name}" + "${next.name}" → save 1 week`,save:1,ids:[t.id,next.id]});
      weeksSaved++;
    } else if(dur>2&&weeksSaved<behind){
      suggestions.push({type:'compress',text:`Compress "${t.name}" to ${dur-1}w (from ${dur}w)`,save:1,id:t.id});
      weeksSaved++;
    }
  });

  if(weeksSaved<behind){
    const extra=behind-weeksSaved;
    suggestions.push({type:'shift',text:`Shift remaining ${remaining.length-suggestions.length} topics forward ${extra}w`,save:extra,shift:extra});
  }

  // Show plan in a modal-style panel
  const planHTML=suggestions.map((s,i)=>`
    <div style="display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:var(--panel);
      border:1px solid var(--border);border-radius:8px;margin-bottom:6px;">
      <span style="font-size:16px;flex-shrink:0;">${s.type==='merge'?'🔗':s.type==='compress'?'⬛':'→'}</span>
      <div style="flex:1;">
        <div style="font-size:12px;font-weight:500;">${s.text}</div>
        <div style="font-size:10px;color:var(--teal);margin-top:2px;">Saves ${s.save} week${s.save>1?'s':''}</div>
      </div>
      <input type="checkbox" id="sug-${i}" checked style="accent-color:var(--acc);width:15px;height:15px;cursor:pointer;flex-shrink:0;">
    </div>`).join('');

  const modal=document.createElement('div');
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:400;backdrop-filter:blur(4px);';
  modal.innerHTML=`<div style="background:var(--panel2);border:1px solid var(--border2);border-radius:16px;padding:24px;width:440px;max-width:94vw;max-height:80vh;overflow-y:auto;">
    <div style="font-size:17px;font-weight:700;margin-bottom:4px;">🧠 Smart Catch-up Plan</div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:16px;">${name} is <strong style="color:var(--red);">${behind}w behind</strong> in ${cls.name}. Suggested recovery:</div>
    ${planHTML}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button onclick="applyCatchup(this,'${name}','${cls.id}')" class="btna btn" style="flex:1;padding:10px;font-size:13px;font-weight:600;">Apply selected</button>
      <button onclick="this.closest('[style*=fixed]').remove()" class="btn" style="padding:10px 16px;font-size:13px;">Cancel</button>
    </div>
  </div>`;
  modal._suggestions=suggestions;
  document.body.appendChild(modal);
}

function applyCatchup(btn, name, clsId){
  const modal=btn.closest('[style*=fixed]');
  const sugs=modal._suggestions||[];
  const cls=getCls(clsId);
  if(!cls) return;
  _pushUndo();
  sugs.forEach((s,i)=>{
    const cb=document.getElementById('sug-'+i);
    if(!cb||!cb.checked) return;
    if(s.type==='compress'&&s.id){
      const t=cls.topics.find(x=>x.id===s.id);
      if(t){t.end=t.end-1;}
    } else if(s.type==='shift'&&s.shift){
      const remaining=cls.topics.filter(t=>T[name]?.progress?.[t.id]?.status!=='taught');
      remaining.forEach(t=>{t.start+=s.shift;t.end+=s.shift;});
    }
  });
  modal.remove();
  savT();renderGanttSection();
  showToast('Catch-up plan applied for '+name);
}

/* ════ RESOURCE LINKS ════════════════════════════════════
   Topics can have attached resource links (URL + label).
   Stored in localStorage per class/topic.
════════════════════════════════════════════════════════ */
const RES_KEY='lf_res';
function getResources(clsId, topicId){
  try{const all=JSON.parse(localStorage.getItem(RES_KEY)||'{}');return (all[clsId]||{})[topicId]||[];}catch(e){return [];}
}
function saveResources(clsId, topicId, links){
  try{
    const all=JSON.parse(localStorage.getItem(RES_KEY)||'{}');
    if(!all[clsId]) all[clsId]={};
    all[clsId][topicId]=links.filter(l=>l.url&&l.url.trim());
    localStorage.setItem(RES_KEY,JSON.stringify(all));
  }catch(e){}
}
function addResource(clsId, topicId, label, url){
  if(!url||!url.trim()) return;
  const links=getResources(clsId,topicId);
  links.push({label:label.trim()||url.trim(), url:url.trim(), added:new Date().toISOString()});
  saveResources(clsId,topicId,links);
}
function removeResource(clsId, topicId, idx){
  const links=getResources(clsId,topicId);
  links.splice(idx,1);
  saveResources(clsId,topicId,links);
}
function linkIcon(url){
  if(/youtube\.com|youtu\.be/.test(url)) return '▶';
  if(/docs\.google|drive\.google/.test(url)) return '📄';
  if(/\.pdf$/i.test(url)) return '📕';
  if(/\.pptx?$/i.test(url)) return '📊';
  return '🔗';
}
function savNoteTyped(name, tid, text, type){
  if(!T[name]) return;
  if(!canEdit(name)) return;
  if(!T[name].notes) T[name].notes={};
  T[name].notes[tid]={text:text.trim(), type:type||'info', updated:new Date().toISOString(), updatedAt:Date.now()};
  savT();
}
function saveScore(name, tid, score){
  if(!T[name]) return;
  if(!canEdit(name)) return;
  const p=gp(name,tid);
  p.score=(score===''||score===null)?null:Math.max(0,Math.min(100,+score));
  savT(); render();
}
function scoreColour(score){
  if(score===null||score===undefined) return null;
  if(score>=70) return '#00c9a7'; // teal — good
  if(score>=50) return '#ffaa40'; // amber — needs work
  return '#ff4f6e'; // red — concern
}
function scoreLabel(score){
  if(score===null||score===undefined) return '';
  if(score>=70) return '✓';
  if(score>=50) return '~';
  return '!';
}
function getNoteText(name, tid){
  const n=T[name]?.notes?.[tid];
  return n?(typeof n==='string'?n:n.text):'';
}
function getNoteType(name, tid){
  const n=T[name]?.notes?.[tid];
  return n&&typeof n==='object'?n.type:'info';
}

function svgCircle(pct, col, size=72){
  const r=30, cx=size/2, cy=size/2;
  const circ=2*Math.PI*r;
  const dash=circ*pct/100;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="5"
      stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
      stroke-linecap="round" style="transition:stroke-dasharray .8s ease"/>
  </svg>`;
}

/* ════ CSV EXPORT ════ */
function exportCSV(){
  const cw=getCW(), classes=allCls(), tn=Ts();
  const rows=[['Year Group','Topic','Planned Start','Planned End','Planned Weeks','Teacher','Actual Start','Actual End','Actual Weeks','Delta (weeks)','Status','Note','Score %']];
  classes.forEach(cls=>{
    cls.topics.forEach(t=>{
      const pw=t.end-t.start+1;
      if(!tn.length){
        rows.push([cls.name,t.name,t.start,t.end,pw,'','','','','','','']);
      } else {
        tn.forEach(name=>{
          const p=T[name]?.progress?.[t.id]||{};
          const as=p.actualStart||'',ae=p.actualEnd||'';
          const aw=as&&ae?ae-as+1:'';
          const delta=aw?aw-pw:'';
          const note=T[name]?.notes?.[t.id]||'';
          const sc=p.score!=null?p.score:'';
          rows.push([cls.name,t.name,t.start,t.end,pw,name,as,ae,aw,delta,p.status||'none',note,sc]);
        });
      }
    });
  });
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`LessonFlow_${PD.term.replace(/\s+/g,'_')}_W${cw}.csv`;
  a.click();
  showToast('CSV downloaded');
}

    <div class="stair-tool${YID==='__roster'?' on':''}" onclick="YID='__roster';DASH=false;render();">👥 <span>Teacher roster</span></div>
    <div class="stair-tool${YID==='__curric'?' on':''}" onclick="YID='__curric';DASH=false;render();">📅 <span>Edit curriculum</span></div>
    <div class="stair-tool${YID==='__strands'?' on':''}" onclick="YID='__strands';DASH=false;render();">🗂 <span>Topic strands</span></div>
    <div class="stair-tool${YID==='__calendar'?' on':''}" onclick="YID='__calendar';DASH=false;render();">🗓 <span>School calendar</span></div>
    <div class="stair-tool${YID==='__slt'?' on':''}" onclick="YID='__slt';DASH=false;render();">🏫 <span>SLT report</span></div>
    <div class="stair-div" style="margin:6px 10px;"></div>
    <div class="stair-tool${YID==='__add'?' on':''}" onclick="goY('__add')" style="color:var(--acc);">⚙ <span>Settings</span></div>
    <div class="stair-tool" onclick="MODAL=true;render()">👤 <span style="color:${U?'var(--teal)':'var(--text2)'};">${U||'Set your name'}</span></div>
  `:`
    <div class="stair-div" style="margin:2px 10px 4px;"></div>
    <div class="stair-tool${YID==='__add'?' on':''}" onclick="goY('__add')" style="color:var(--acc);">⚙ <span>Settings</span></div>
    <div class="stair-tool" onclick="MODAL=true;render()">👤 <span style="color:${U?'var(--teal)':'var(--text2)'};">${U||'Set your name'}</span></div>
  `;

  // Alert bar (HoD only, inside right panel)
  const rpEl=document.getElementById('right-panel');
  if(rpEl&&isHoD()&&!DASH){setTimeout(()=>renderAlertBar(rpEl),50);}
  else{const ab=document.getElementById('alert-bar');if(ab)ab.remove();}

  // Topbar class info
  const activeCls=getCls(YID);
  const hodBadge=isHoD()?`<span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,212,173,.15);color:var(--teal);padding:2px 8px;border-radius:10px;flex-shrink:0;">HoD</span>`:'';
  document.getElementById('tb-info').innerHTML=DASH
    ?`<span class="tb-title">LessonFlow</span><span class="tb-meta">Department overview</span>${hodBadge}`

        <span class="tb-title">${activeCls.name}</span>
        <span class="tb-meta">Week ${cw} · ${wLabel(cw)}</span>

      :`<span class="tb-title">${YID==='__hod'?'Department':YID==='__add'?'Settings':'LessonFlow'}</span>`;

  // Personal / Team toggle (only for regular teachers, not HoD)
  const tbr=document.querySelector('.tb-r');

  if(!DASH&&activeCls&&!existingToggle&&!isHoD()){
    const tog=document.createElement('div');
    tog.id='team-toggle';
    tog.className='view-toggle';
    const _tv=TEAM_VIEW;
    tog.innerHTML=`<button class="vt-pill${!_tv?' on':''}" onclick="TEAM_VIEW=false;render()">👤 Personal</button>
      <button class="vt-pill${_tv?' on':''}" onclick="TEAM_VIEW=true;render()">👥 Team</button>`;
    const ncw=document.getElementById('name-chip-wrap');
    if(ncw&&tbr) tbr.insertBefore(tog,ncw);
  } else if((DASH||!activeCls)&&existingToggle){
    existingToggle.remove();
  }

  // scope buttons sync
  ['this','prev','next','should'].forEach(s=>{
    const el=document.getElementById('sb-'+s);
    if(el) el.classList.toggle('on',SCOPE===s);
  });

  // Content routing
  // Dashboard home — hide subtabs + sidebar, show bento grid
  if(DASH){
    document.getElementById('view-tabs').style.display='none';
    document.getElementById('scope-bar').style.display='none';
    document.getElementById('stair-sb').classList.add('hidden');
    renderDashboard();
    // Animate content sliding back from left
    const co=document.getElementById('content');
    co.classList.remove('slide-in-right','slide-in-left');
    void co.offsetWidth; // force reflow
    co.classList.add('slide-in-left');
    if(MODAL) renderModal(); else document.getElementById('mslot').innerHTML='';
    return;
  }

  // In simple mode (Today View), hide sidebar — teachers don't need class navigation
  if(SIMPLE_MODE&&!isHoD()){
    document.getElementById('stair-sb').classList.add('hidden');
  } else {
    document.getElementById('stair-sb').classList.remove('hidden');
  }
  if(YID==='__hod'){ renderHoD(); return; }
  if(YID==='__add'){ renderAddCls(); return; }
  if(YID==='__curric'){ renderCurricEditor(); return; }
  if(YID==='__roster'){ renderRoster(); return; }
  if(YID==='__strands'){ renderStrandManager(); return; }
  if(YID==='__today'){ SIMPLE_MODE=true;localStorage.setItem('lf_simple','1');render(); return; }
  if(YID==='__digest'){ renderWeeklyDigest(); return; }
  if(YID==='__calendar'){ renderCalendar(); return; }
  if(YID==='__slt'){ renderSLT(); return; }
  const cls=getCls(YID);
  if(!cls){ document.getElementById('content').innerHTML=''; return; }

  // ── View tabs (only for year groups) ──
  const cw2=getCW();
  const behindCt=Ts().filter(n=>wksBehind(n,cls,cw2)>0).length;
  const upcomingCt=cls.topics.filter(t=>t.start>cw2&&t.start<=cw2+3).length;
  const vtEl=document.getElementById('view-tabs');
  vtEl.style.display='flex';
  vtEl.innerHTML=[
    ['gantt','📊 Gantt',''],
    ['analytics','📈 Analytics',''],
    ['behind',`⚠ Behind`,behindCt?`<span class="vt-badge" style="background:var(--red);">${behindCt}</span>`:''],
    ['upcoming','⏭ Upcoming',upcomingCt?`<span class="vt-badge" style="background:var(--amber);">${upcomingCt}</span>`:''],
  ].map(([id,lbl,badge])=>`<button class="vt${VIEW===id?' on':''}" onclick="setView('${id}')">${lbl}${badge}</button>`).join('');

  // Show/hide scope bar (gantt only)
  const sbEl=document.getElementById('scope-bar');
  sbEl.style.display=VIEW==='gantt'?'flex':'none';

  // Clear modal slot unless we want the modal showing
  if(!MODAL){
    var _ms=document.getElementById('mslot');
    if(_ms) _ms.innerHTML='';
  }
  if(canViewDept()){
    if(MODAL) renderModal();
    if(DASH){renderDashboard();return;}
  } else if(SIMPLE_MODE){
    if(MODAL) renderModal();
    renderToday();
    return;
  }
  if(VIEW==='todo') renderTodo();
  else if(!cls){/* no class selected, show placeholder */
    const co=document.getElementById('content');
    if(co) co.innerHTML='<div style="padding:24px;text-align:center;color:var(--text2);font-size:13px;">Select a year group from the sidebar.</div>';
  }
  else if(VIEW==='checkin'){VIEW='gantt';renderGanttSection();}
  else if(VIEW==='gantt') renderGanttSection();
  else if(VIEW==='analytics') renderAnalytics(cls);
  else if(VIEW==='behind') renderBehind(cls);
  else if(VIEW==='upcoming') renderUpcoming(cls);

  // Slide animation — only animate direction changes, not tab switches
  if(SLIDE_DIR){
    const co=document.getElementById('content');
    co.classList.remove('slide-in-right','slide-in-left');
    void co.offsetWidth;
    co.classList.add(SLIDE_DIR==='right'?'slide-in-right':'slide-in-left');
    SLIDE_DIR=null;
  }

  if(MODAL) renderModal(); else document.getElementById('mslot').innerHTML='';
}

/* ════ ANALYTICS ════ */
function renderAnalytics(cls){
  const tn=viewTs(cls.id),col=cls.color;
  const co=document.getElementById('content');
  co.style.overflowY='auto';

  const atabH=`<div class="atab">${[['overview','Overview'],['by-topic','By topic'],['by-strand','By strand'],['by-teacher','By teacher']].map(([id,lb])=>`<button class="atb${ATAB===id?' on':''}" onclick="ATAB='${id}';renderAnalytics(getCls('${cls.id}'))">${lb}</button>`).join('')}</div>`;

  if(!tn.length){co.innerHTML=`<div class="page">${atabH}<div class="card gray" style="padding:20px;text-align:center;color:var(--text2);">No teacher data yet.</div></div>`;return;}

  const ts=cls.topics.map(t=>{
    const pl=t.end-t.start+1;
    const acts=tn.map(n=>{const p=T[n]?.progress?.[t.id];return p&&p.actualStart&&p.actualEnd?{n,wks:p.actualEnd-p.actualStart+1,s:p.status,e:p.early}:null;}).filter(Boolean);
    const taught=acts.filter(a=>a.s==='taught');
    const avg=taught.length?Math.round(10*taught.reduce((s,a)=>s+a.wks,0)/taught.length)/10:null;
    return{topic:t,pl,acts,taught,avg,delta:avg!==null?Math.round(10*(avg-pl))/10:null};
  });
  const wd=ts.filter(s=>s.avg!==null);
  const avgD=wd.length?Math.round(10*wd.reduce((s,s2)=>s+(s2.delta||0),0)/wd.length)/10:null;
  const over=wd.filter(s=>s.delta>0),under=wd.filter(s=>s.delta<0);

  const overviewHTML=`<div class="sg">
    <div class="sc"><div class="sl">Planned total</div><div class="sv">${cls.topics.reduce((s,t)=>s+(t.end-t.start+1),0)}w</div></div>
    <div class="sc"><div class="sl">With data</div><div class="sv">${wd.length}<span style="font-size:13px;color:var(--text2);">/${cls.topics.length}</span></div></div>
    <div class="sc"><div class="sl">Avg delta</div><div class="sv" style="color:${avgD>0?'var(--red)':avgD<0?'var(--teal)':'var(--text)'};">${avgD!==null?(avgD>0?'+':'')+avgD+'w':'–'}</div></div>
    <div class="sc"><div class="sl">Over plan</div><div class="sv" style="color:var(--red);">${over.length}</div></div>
    <div class="sc"><div class="sl">Under plan</div><div class="sv" style="color:var(--teal);">${under.length}</div></div>
  </div>
  ${wd.length?`
    ${over.length?`<div class="sec-l" style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;">Needs more time — recommend increasing allocation next year</div>
    ${over.sort((a,b)=>b.delta-a.delta).map(s=>`<div class="card red" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px;"><div><div style="font-size:13px;font-weight:500;">${s.topic.name}</div><div style="font-size:12px;color:var(--text2);">Planned ${s.pl}w · Avg actual ${s.avg}w · ${s.taught.length} teacher${s.taught.length!==1?'s':''}</div></div><span class="pill" style="background:rgba(255,79,110,.15);color:var(--red);">+${s.delta}w over</span></div>`).join('')}`:''}
    ${under.length?`<div class="sec-l" style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin:12px 0 8px;">Could be shorter next year</div>
    ${under.sort((a,b)=>a.delta-b.delta).map(s=>`<div class="card green" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px;"><div><div style="font-size:13px;font-weight:500;">${s.topic.name}</div><div style="font-size:12px;color:var(--text2);">Planned ${s.pl}w · Avg ${s.avg}w</div></div><span class="pill" style="background:rgba(61,206,122,.15);color:var(--green);">${s.delta}w</span></div>`).join('')}`:''}
  `:`<div class="card gray" style="color:var(--text2);">Drag bars on the Gantt to log actual start/end weeks — analytics will populate automatically.</div>`}`;

  const byTopicHTML=`<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;min-width:500px;">
    <thead><tr style="background:var(--panel2);">
      <th style="padding:7px 10px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);color:var(--text3);">Topic</th>
      <th style="padding:7px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);color:var(--text3);">Strand</th>
      <th style="padding:7px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);text-align:center;color:var(--text3);">Plan</th>
      ${tn.map(n=>`<th style="padding:7px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);text-align:center;color:var(--text3);max-width:80px;overflow:hidden;text-overflow:ellipsis;">${n}</th>`).join('')}
      <th style="padding:7px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);text-align:center;color:var(--text3);">Avg</th>
      <th style="padding:7px 8px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);text-align:center;color:var(--text3);">Delta</th>
    </tr></thead>
    <tbody>${ts.map(s=>{
      const cells=tn.map(n=>{
        const p=T[n]?.progress?.[s.topic.id];
        const ed=getEffectiveDates(s.topic,n);
        if(!p||(!p.actualStart&&ed.start===s.topic.start)||!p.actualEnd){const st=p?.status||'none';return `<td style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-size:13px;color:${st==='taught'?'var(--teal)':st==='progress'?'var(--amber)':'var(--text3)'};">${st==='taught'?'✓':st==='progress'?'→':'–'}</td>`;}
        const wks=p.actualEnd-p.actualStart+1,d=wks-s.pl;
        return `<td style="padding:4px 8px;border:1px solid var(--border);text-align:center;"><span class="pill" style="${d>0?'background:rgba(255,79,110,.15);color:var(--red);':d<0?'background:rgba(61,206,122,.15);color:var(--green);':'background:var(--panel2);color:var(--text2);'}font-size:11px;">${wks}w${d!==0?(d>0?' +'+d:' '+d)+'w':''}</span></td>`;
      }).join('');
      const dS=s.delta===null?'color:var(--text3)':s.delta>0?'color:var(--red);font-weight:600':'color:var(--teal);font-weight:600';
      return `<tr style="border-bottom:1px solid var(--border);"><td style="padding:6px 10px;border:1px solid var(--border);font-size:13px;">${s.topic.name}</td><td style="padding:5px 8px;border:1px solid var(--border);">${(()=>{const strd=getTopicStrand(cls.id,s.topic.id);return strd?`<span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;background:${strd.color}22;color:${strd.color};">${strd.name}</span>`:"—";})()}</td><td style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-size:13px;color:var(--text2);">${s.pl}w</td>${cells}<td style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-size:13px;">${s.avg!==null?s.avg+'w':'–'}</td><td style="padding:5px 8px;border:1px solid var(--border);text-align:center;font-size:13px;${dS};">${s.delta!==null?(s.delta>0?'+':'')+s.delta+'w':'–'}</td></tr>`;
    }).join('')}</tbody>
  </table></div>`;

  const byTeacherHTML=tn.map(name=>{
    const ac=avCol(name);
    const data=cls.topics.map(t=>{const p=T[name]?.progress?.[t.id],pl=t.end-t.start+1,ac2=p&&p.actualStart&&p.actualEnd?p.actualEnd-p.actualStart+1:null;return{t,pl,ac2,delta:ac2!==null?ac2-pl:null,s:p?.status||'none',e:p?.early};});
    const wd2=data.filter(d=>d.ac2!==null),tD=wd2.reduce((s,d)=>s+d.delta,0),oC=wd2.filter(d=>d.delta>0).length;
    const progPct=Math.round(data.filter(d=>d.s==='taught').length/cls.topics.length*100);
    return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px;">
      <div style="padding:9px 13px;background:var(--panel2);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="av" style="background:${ac};width:28px;height:28px;font-size:10px;">${ini(name)}</div>
          <div>
            <div style="font-size:13px;font-weight:500;">${name}</div>
            <div style="font-size:10px;color:var(--text3);display:flex;align-items:center;gap:6px;margin-top:2px;">
              <span>${progPct}%</span>
              <div style="width:60px;height:4px;background:var(--panel3);border-radius:2px;overflow:hidden;"><div style="height:100%;background:${col};border-radius:2px;width:${progPct}%;"></div></div>
            </div>
          </div>
        </div>

/* ════ PREDICTIVE SCHEDULE SHIFT ════ */
function suggestReschedule(name, cls){
  if(!T[name]||!isHoD()&&name!==U) return;
  const cw2=getCW();
  const behind=wksBehind(name,cls,cw2);
  if(behind<=0){showToast('No rescheduling needed - you are on track!');return;}
  // Find first untaught future topic
  const remaining=cls.topics.filter(t=>T[name]?.progress?.[t.id]?.status!=='taught'&&t.start>=cw2);
  if(!remaining.length){showToast('All future topics are already taught.');return;}
  const lines=[`${name} is ${behind}w behind in ${cls.name}.`,'','Suggested adjustments:'];
  let shiftAcc=behind;
  remaining.forEach((t,i)=>{
    if(i<5){
      const newStart=t.start+shiftAcc, newEnd=t.end+shiftAcc;
      lines.push(`  ${i+1}. ${t.name}: W${t.start}–${t.end} → W${newStart}–${newEnd}`);
    }
  });
  if(remaining.length>5) lines.push(`  …and ${remaining.length-5} more topics shifted`);
  lines.push('','This will move the planned Gantt bars for '+cls.name+' — the change will be visible to all.');
  if(!confirm(lines.join('\n'))) return;
  _pushUndo();
  remaining.forEach(t=>{
    t.start += shiftAcc;
    t.end   += shiftAcc;
    const p=gp(name,t.id);
    delete p.actualStart;
    delete p.actualEnd;
  });
  savT(); savC(); renderGanttSection();
  showToast('\u2713 '+remaining.length+' topics shifted +'+shiftAcc+'w');
}

    const avgPct=classes.reduce((s,cls)=>s+pct(name,cls),0)/classes.length;
    let risk='green'; // on track
    if(totalBehind>=3||totalOverdue>=3) risk='red';

function renderSetup(){
  const ov=document.getElementById('setup-overlay');
  ov.style.display='flex';
  // Ensure close button exists
  if(!ov.querySelector('.setup-close-x')){
    const xb=document.createElement('button');
    xb.className='setup-close-x';
    xb.textContent='✕';
    xb.title='Close setup';
    xb.style.cssText='position:absolute;top:16px;right:20px;background:none;border:none;color:var(--text3);font-size:22px;cursor:pointer;z-index:10;line-height:1;padding:4px 8px;border-radius:6px;';
    xb.onmouseenter=()=>xb.style.color='var(--text)';
    xb.onmouseleave=()=>xb.style.color='var(--text3)';
    xb.onclick=()=>{SETUP=false;ov.style.display='none';render();};
    ov.appendChild(xb);
  }
  const steps=[
    {label:'Sign in'},
    {label:'AI provider'},
    {label:'Upload SoW'},
    {label:'Review'}
  ];
  const stepsHTML=steps.map((s,i)=>`
    <div class="setup-step-dot">
      <div class="sdot ${SETUP_STEP>i+1?'done':SETUP_STEP===i+1?'active':''}">${SETUP_STEP>i+1?'✓':i+1}</div>
      <div class="sdot-lbl">${s.label}</div>
    </div>`).join('');

  let bodyHTML='';

  if(SETUP_STEP===1){
    // ── STEP 1: Authentication ──
    const opts=[

/* ── Setup actions ── */
function setupAuth(){
  const sd=SETUP_DATA;
  if(sd.authType==='guest'){
    const n=(document.getElementById('guest-name')||{}).value||sd.guestName||'';
    if(!n.trim()){showToast('Please enter your name to continue.');return;}
    // Store role explicitly, not just in name
    setRole(sd.role==='hod'?'hod':'teacher');
    // Append HoD marker to name if role is HoD
    U=(sd.role==='hod'&&!n.toLowerCase().includes('hod')?n+' (HoD)':n).trim();
    savU();
  } else if(sd.authType==='ms'){
    signInMS();return;
  } else if(sd.authType==='google'){
    signInGoogle();return;
  }
  SETUP_STEP=2; renderSetup();
}

function setupSaveConfig(){
  const cfg={
    aiProvider:SETUP_DATA.aiProvider,
    apiKey:SETUP_DATA.apiKey||'',
    azureEndpoint:SETUP_DATA.azureEndpoint||'',
    azureDeployment:SETUP_DATA.azureDeployment||'gpt-4o',
    geminiKey:SETUP_DATA.geminiKey||'',
    claudeModel:SETUP_DATA.claudeModel||'claude-sonnet-4-20250514',
    authType:SETUP_DATA.authType,
    msClientId:SETUP_DATA.msClientId||'',
    googleClientId:SETUP_DATA.googleClientId||'',
    setupComplete:true
  };
  try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));}catch(e){}
}

function finishSetup(){
  setupSaveConfig();
  if(SETUP_DATA.parsedClasses){
    try{localStorage.setItem(SOL_KEY,JSON.stringify(SETUP_DATA.parsedClasses));}catch(e){}
    // Merge parsed classes into live PD
    SETUP_DATA.parsedClasses.forEach(nc=>{
      const idx=PD.classes.findIndex(c=>c.id===nc.id);
      if(idx>-1) PD.classes[idx]=nc; else PD.classes.push(nc);
    });
  }
  SETUP=false;
  document.getElementById('setup-overlay').style.display='none';
  if(!U) MODAL=true;
  YID=PD.classes[0]?.id||'y7';
  render();
}

/* ── SSO stubs ── */
function signInMS(){
  const clientId=SETUP_DATA.msClientId;
  if(!clientId){showToast('Enter your Azure Client ID first.');return;}
  // Dynamically load MSAL
  if(!window.msal){
    const s=document.createElement('script');
    s.src='https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js';
    s.onload=()=>_doMSAL(clientId);
    document.head.appendChild(s);
  } else _doMSAL(clientId);
}
function _doMSAL(clientId){
  try{
    const app=new window.msal.PublicClientApplication({auth:{clientId,redirectUri:location.origin+location.pathname}});
    app.loginPopup({scopes:['user.read']}).then(r=>{
      U=r.account.name||r.account.username; savU();
      showToast('Signed in as '+U);
      SETUP_STEP=2; renderSetup();
    }).catch(e=>showToast('MS sign-in failed: '+e.message));
  }catch(e){showToast('MSAL error: '+e.message);}
}
function signInGoogle(){
  const clientId=SETUP_DATA.googleClientId;
  if(!clientId){showToast('Enter your Google Client ID first.');return;}
  if(!window.google?.accounts){
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=()=>_doGoogle(clientId);
    document.head.appendChild(s);
  } else _doGoogle(clientId);
}
function _doGoogle(clientId){
  try{
    window.google.accounts.id.initialize({client_id:clientId,callback:r=>{
      const payload=JSON.parse(atob(r.credential.split('.')[1]));
      U=payload.name||payload.email; savU();
      showToast('Signed in as '+U);
      SETUP_STEP=2; renderSetup();
    }});
    window.google.accounts.id.prompt();
  }catch(e){showToast('Google sign-in failed: '+e.message);}
}

/* ── File handling ── */
function handleFileDrop(e){handleFileSelect(e.dataTransfer.files[0]);}
function handleFileSelect(file){
  if(!file) return;
  SETUP_DATA.fileName=file.name;
  SETUP_DATA.fileObj=file;
  SETUP_DATA.parsedClasses=null;
  SETUP_DATA.rawRows=null;
  renderSetup();
}

/* ── Quick read: parse Excel rows without AI, show manual mapper ── */
async function quickReadFile(){
  const file=SETUP_DATA.fileObj;
  if(!file) return;
  SETUP_DATA.processing=true; renderSetup();
  try{
    const ext=file.name.split('.').pop().toLowerCase();
    let rows=[];

    if(ext==='xlsx'||ext==='xls'){
      if(!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array'});
      // Prefer 'Timeline' sheet if available, else use first sheet
      const timelineSheet = wb.SheetNames.find(n=>n.toLowerCase().includes('timeline'));
      const sheetName = timelineSheet || wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''}).filter(r=>r.some(v=>String(v).trim()));
      SETUP_DATA.sheetName = sheetName;
      SETUP_DATA.allSheets = wb.SheetNames;
    } else if(ext==='csv'){
      const text=await file.text();
      rows=text.split('\n').map(l=>l.split(',').map(v=>v.trim().replace(/^"|"$/g,'')));
    } else {
      // For PDF/docx without AI: skip to manual entry
      rows=[['Topic Name','Weeks'],['Example: Algebra',2],['Example: Fractions',1]];
    }

    SETUP_DATA.rawRows=rows;
    SETUP_DATA.processing=false;
    // Auto-detect columns and build a simple parsed structure for review
    autoMapRows(rows);
  }catch(err){
    SETUP_DATA.processing=false;
    showToast('Could not read file: '+err.message+'. Try Skip to use the built-in curriculum.');
    renderSetup();
  }
}


/* ════ TIMELINE FORMAT PARSER (Trinity/WRM style) ═════════ */
function parseTimelineRows(rows){
  const SKIP = [/\bblank\b/i,/\bcamp\b/i,/\bcatch.up\b/i,/\brevision\b/i,
    /\binset\b/i,/\bmock\b/i,/\bgcse\b/i,/\bexam\b/i,/\baw[12]\b/i,/\b& er\b/i];
  function skipTopic(v){ if(!v) return true; const s=String(v); return SKIP.some(p=>p.test(s)); }
  function cleanTopic(v){
    if(!v) return null;
    const lines=String(v).split('\n').map(l=>l.trim()).filter(Boolean);
    if(!lines.length) return null;
    let first=lines[0];
    if(/^supp\s+[\d.]+/i.test(first)){
      const next=lines.find((l,i)=>i>0&&!skipTopic(l));
      first=next||first.replace(/^supp\s+[\d.]+[a-z]?\s+/i,'').trim();
    }
    if(skipTopic(first)) return null;
    return first.replace(/\s*\[optional\]/i,'').replace(/\s*\(inc\..*?\)/,'').trim()||null;
  }

  // Find header row (has 'Week' in col B)
  const hdrIdx = rows.findIndex((r,i)=>i>0&&String(r[1]||'').toLowerCase().trim()==='week');
  if(hdrIdx<0) return null;
  const hdr = rows[hdrIdx];

  // Find year group columns
  const COLORS=['#6c56f5','#00d4ad','#f5564a','#f0b429','#3b82f6','#e879f9'];
  const yrCols=[];
  hdr.forEach((cell,i)=>{
    if(!cell||i<3) return;
    const m=String(cell).match(/Y(?:ear)?\s*(\d{1,2})(?:\s*\(([^)]+)\))?/i);
    if(m) yrCols.push({col:i,name:'Year '+m[1]+(m[2]?' ('+m[2]+')':''),color:COLORS[yrCols.length%COLORS.length]});
  });
  if(!yrCols.length) return null;

  // Parse week rows
  const weekData={};
  rows.slice(hdrIdx+1).forEach(row=>{
    if(!row[1]) return;
    const wk=parseInt(String(row[1]).trim());
    if(isNaN(wk)||wk<1||wk>60) return;
    if(!weekData[wk]) weekData[wk]={};
    yrCols.forEach(({col,name})=>{
      const t=cleanTopic(row[col]);
      if(t) weekData[wk][name]=t;
    });
  });

  // Forward-fill
  const prev={};
  Object.keys(weekData).sort((a,b)=>+a-+b).forEach(wk=>{
    yrCols.forEach(({name})=>{
      if(weekData[wk][name]) prev[name]=weekData[wk][name];
      else if(prev[name]) weekData[wk][name]=prev[name];
    });
  });

  // Group into topic blocks
  const maxWk=Math.max(...Object.keys(weekData).map(Number));
  return yrCols.map(({name,color},ci)=>{
    const topics=[]; let cur=null,start=null,tid=0;
    const sid=name.toLowerCase().replace(/[^a-z0-9]/g,'');
    Object.keys(weekData).sort((a,b)=>+a-+b).forEach(wk=>{
      const w=+wk,t=weekData[wk][name];
      if(t!==cur){
        if(cur&&start) topics.push({id:sid+'_t'+(++tid),name:cur,start,end:w-1});
        cur=t; start=t?w:null;
      }
    });
    if(cur&&start) topics.push({id:sid+'_t'+(++tid),name:cur,start,end:maxWk});
    return {id:sid,name,color,topics};
  }).filter(c=>c.topics.length);
}

function autoMapRows(rows){
  if(!rows||!rows.length){renderSetup();return;}

  // ── TIMELINE FORMAT DETECTION ────────────────────────────
  // Trinity/WRM style: row 1 has year names, col B has week numbers
  const row1 = (rows[1]||[]).map(v=>String(v));
  const hasWeekCol = row1.some(v=>/^week$/i.test(v.trim()));
  const hasYearCol = row1.some(v=>/year\s*\d+/i.test(v));
  if(hasWeekCol && hasYearCol){
    const parsed = parseTimelineRows(rows);
    if(parsed && parsed.length){
      SETUP_DATA.parsedClasses = parsed;
      showToast('✓ Timeline format detected — '+parsed.length+' year groups, '+parsed.reduce((s,c)=>s+c.topics.length,0)+' topics');
      renderSetup();
      return;
    }
  }

  const header=rows[0].map(v=>String(v).toLowerCase());
  // Find topic name column (looks for 'topic', 'name', 'title', 'unit' or first text col)
  const nameCol=header.findIndex(h=>/(topic|name|title|unit|content|subject)/i.test(h));
  // Find duration column (looks for 'week', 'duration', 'time', 'hours', 'lessons')
  const durCol=header.findIndex(h=>/(week|duration|time|hour|lesson|period)/i.test(h));
  // Find year group column
  const yearCol=header.findIndex(h=>/(year|group|class|set)/i.test(h));

  // Build topics from rows (skip header)
  const topicRows=rows.slice(1).filter(r=>r[nameCol<0?0:nameCol]&&String(r[nameCol<0?0:nameCol]).trim());

  if(!topicRows.length){
    showToast('No topic rows found. Try mapping columns manually below.');
    SETUP_DATA.colMap={nameCol,durCol,yearCol,rows};
    SETUP_STEP=4; renderSetup(); return;
  }

  // Group by year if year column found, otherwise one group
  const groups={};
  topicRows.forEach(r=>{
    const yRaw=yearCol>=0?String(r[yearCol]||'').trim():'';
    const yKey=yRaw||'Year Group';
    if(!groups[yKey]) groups[yKey]=[];
    const name=String(r[nameCol<0?0:nameCol]||'').trim();
    const durRaw=durCol>=0?parseFloat(r[durCol])||1:1;
    const dur=Math.max(1,Math.min(Math.round(durRaw),8));
    if(name) groups[yKey].push({name,dur});
  });

  // Convert to PD.classes format with week numbers
  const YR_COLORS=['#6c56f5','#00c9a7','#ffaa40','#ff4f6e','#9b72e0','#3dce7a','#e05a8a','#4ad4e0'];
  const parsed=Object.entries(groups).map(([grpName,topics],gi)=>{
    let week=1;
    return{
      id:'imported_'+gi,
      name:grpName,
      color:YR_COLORS[gi%YR_COLORS.length],
      _custom:true,
      topics:topics.map((t,ti)=>{
        const start=week, end=week+t.dur-1;
        week=end+1;
        return{id:'imp_'+gi+'_'+ti, name:t.name, start, end};
      })
    };
  });

  SETUP_DATA.parsedClasses=parsed;
  SETUP_DATA.processing=false;
  SETUP_STEP=4;
  renderSetup();
}

async function parseDocument(){
  const file=SETUP_DATA.fileObj;
  if(!file) return;
  SETUP_DATA.processing=true; renderSetup();
  try{
    let docText='';
    const ext=file.name.split('.').pop().toLowerCase();

    if(ext==='pdf'){
      // Send PDF as base64 to Claude
      const b64=await fileToBase64(file);
      docText='__PDF_BASE64__:'+b64;
    } else if(ext==='xlsx'||ext==='xls'||ext==='csv'){
      docText=await readSpreadsheet(file);
    } else if(ext==='docx'||ext==='doc'){
      docText=await readDocx(file);
    } else {
      docText=await file.text();
    }

    const parsed=await aiParseDocument(docText, file.name);
    SETUP_DATA.parsedClasses=parsed;
    SETUP_DATA.processing=false;
    SETUP_STEP=4; renderSetup();
  }catch(err){
    SETUP_DATA.processing=false;
    showToast('Parse failed: '+err.message);
    renderSetup();
  }
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);
    r.onerror=()=>rej(new Error('File read failed'));
    r.readAsDataURL(file);
  });
}

async function readSpreadsheet(file){
  if(!window.XLSX){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  }
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  let out='';
  wb.SheetNames.forEach(sn=>{
    out+=`\n=== Sheet: ${sn} ===\n`;
    out+=XLSX.utils.sheet_to_csv(wb.Sheets[sn]);
  });
  return out;
}

async function readDocx(file){
  if(!window.mammoth){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  }
  const buf=await file.arrayBuffer();
  const result=await mammoth.extractRawText({arrayBuffer:buf});
  return result.value;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Failed to load '+src));
    document.head.appendChild(s);
  });
}

/* ── AI document parsing ── */
const SOW_PROMPT=`You are a curriculum analyst. Extract the scheme of work from the document below.
Return ONLY a JSON array of year group objects. No markdown, no explanation, just the JSON.
Format:
[{"id":"y7","name":"Year 7","color":"#6c56f5","topics":[{"id":"y7_1","name":"Topic name","start":1,"end":2},...]}]

Rules:
- id must be y7, y8, y9, y10h, y10f, y11, y12, y13 (guess from context)
- start/end are week numbers (1-40), estimate from duration if not explicit
- 1 topic = 1 week unless stated otherwise
- name should include any numbering from the document
- Colors: y7=#6c56f5 y8=#00c9a7 y9=#ffaa40 y10h=#ff4f6e y10f=#9b72e0 y11=#3dce7a y12=#e05a8a y13=#4ad4e0
- If only one year group, wrap it in an array still
- Preserve the original topic names exactly`;

async function aiParseDocument(docText, fileName){
  const cfg=SETUP_DATA;
  const isPdf=docText.startsWith('__PDF_BASE64__:');
  const b64=isPdf?docText.slice(15):'';

  if(cfg.aiProvider==='claude'){
    const key=cfg.apiKey; if(!key) throw new Error('No Claude API key configured');
    const msgContent=isPdf?[
      {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}},
      {type:'text',text:SOW_PROMPT}
    ]:[{type:'text',text:SOW_PROMPT+'\n\nDOCUMENT:\n'+docText}];

    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:cfg.claudeModel||'claude-sonnet-4-20250514',max_tokens:4096,messages:[{role:'user',content:msgContent}]})
    });
    if(!res.ok) throw new Error('Claude API error: '+res.status);
    const d=await res.json();
    return parseAIResponse(d.content[0].text);
  }

  if(cfg.aiProvider==='gemini'){
    const key=cfg.geminiKey; if(!key) throw new Error('No Gemini API key configured');
    const parts=isPdf?[
      {inline_data:{mime_type:'application/pdf',data:b64}},
      {text:SOW_PROMPT}
    ]:[{text:SOW_PROMPT+'\n\nDOCUMENT:\n'+docText}];
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}]})
    });
    if(!res.ok) throw new Error('Gemini API error: '+res.status);
    const d=await res.json();
    return parseAIResponse(d.candidates[0].content.parts[0].text);
  }

  if(cfg.aiProvider==='no-ai'){
    const key=cfg.apiKey, ep=cfg.azureEndpoint, dep=cfg.azureDeployment||'gpt-4o';
    if(!key||!ep) throw new Error('Azure endpoint and key required');
    const res=await fetch(`${ep}/openai/deployments/${dep}/chat/completions?api-version=2024-02-01`,{
      method:'POST',
      headers:{'Content-Type':'application/json','api-key':key},
      body:JSON.stringify({messages:[
        {role:'system',content:'You are a curriculum analyst. Return only valid JSON.'},
        {role:'user',content:SOW_PROMPT+'\n\nDOCUMENT:\n'+(isPdf?'[PDF document — '+fileName+']':docText)}
      ],max_tokens:4096})
    });
    if(!res.ok) throw new Error('Azure OpenAI error: '+res.status);
    const d=await res.json();
    return parseAIResponse(d.choices[0].message.content);
  }

  throw new Error('No AI provider configured');
}

function parseAIResponse(text){
  const clean=text.replace(/```json|```/g,'').trim();
  const arr=JSON.parse(clean);
  if(!Array.isArray(arr)||!arr[0]?.topics) throw new Error('Unexpected AI response format');
  // Validate and fill gaps
  return arr.map(cls=>({
    ...cls,
    id:cls.id||('cx_'+Date.now()),
    topics:(cls.topics||[]).map((t,i)=>({
      id:t.id||cls.id+'_'+(i+1),
      name:t.name||'Topic '+(i+1),
      start:t.start||i+1,
      end:t.end||i+1
    }))
  }));
}

<!-- Service Worker: offline-first caching (http/https only) -->
<script>
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  const swCode=`
const CACHE='lessonflow-v1';
self.addEventListener('install',e=>{self.skipWaiting();});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener('fetch',e=>{
  if(new URL(e.request.url).pathname.startsWith('/api/')){
    e.respondWith(fetch(e.request).catch(()=>new Response('{"error":"offline"}',{headers:{'Content-Type':'application/json'}})));
    return;
  }
  e.respondWith(fetch(e.request).then(r=>{
    if(r&&r.status===200){const clone=r.clone();caches.open(CACHE).then(c=>c.put(e.request,clone));}
    return r;
  }).catch(()=>caches.match(e.request)));
});
`;
  try{
    const blob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).then(()=>{
      navigator.serviceWorker.addEventListener('message',e=>{
        if(e.data?.type==='sync-ready') showToast('📡 Back online');
      });
    }).catch(()=>{});
  }catch(e){}
} else if(location.protocol==='file:'){
  console.info('LessonFlow: open via http:// for offline caching. Works fine without it.');
}
</script>
