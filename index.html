<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content Security Policy: block inline XSS, restrict sources -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.sheetjs.com https://cdnjs.cloudflare.com https://alcdn.msauth.net https://accounts.google.com https://generativelanguage.googleapis.com https://api.anthropic.com; img-src 'self' data: blob:; connect-src *;">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LessonFlow">
<meta name="theme-color" content="#07080f">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22LessonFlow%22%2C%22short_name%22%3A%22LessonFlow%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2307080f%22%2C%22theme_color%22%3A%22%2307080f%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%3D%2527http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%3D%25270%25200%252064%252064%2527%253E%253Crect%2520width%3D%252764%2527%2520height%3D%252764%2527%2520fill%3D%2527%2523170e4a%2527%2520rx%3D%252712%2527%2F%253E%253Ctext%2520x%3D%252732%2527%2520y%3D%252746%2527%2520font-size%3D%252740%2527%2520text-anchor%3D%2527middle%2527%253ELF%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<title>LessonFlow</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;--sb:#0d0f1c;--panel:rgba(20,23,40,0.92);--panel2:#1c1f35;--panel3:#242842;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eceef8;--text2:#6b739a;--text3:#30384f;
  --acc:#7c63f8;--acc-a:rgba(124,99,248,0.18);--acc2:#9b84ff;
  --teal:#00d4ad;--red:#ff4f6e;--amber:#ffb040;--blue:#4a90e0;--green:#3dce7a;
  --today:#4a90e0;
  --card-shadow:0 4px 24px rgba(0,0,0,.45);
  --radius:12px;
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:radial-gradient(ellipse 80% 60% at 80% 0%,#1a1640 0%,var(--bg) 55%);color:var(--text);font-size:13px;display:flex;flex-direction:column}
/* Shell = staircase + right panel, fills body */
#shell{flex:1;display:flex;min-height:0;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:2px}
input,button,select{font-family:inherit;font-size:13px}
input[type=text],input[type=number]{padding:6px 10px;border:1px solid var(--border2);border-radius:6px;color:var(--text);background:var(--panel2);outline:none}
input:focus{border-color:var(--acc)}
.btn{padding:5px 12px;border:1px solid var(--border2);border-radius:8px;background:rgba(255,255,255,.03);color:var(--text2);cursor:pointer;transition:all .12s}
.btn:hover{background:var(--panel2);color:var(--text);border-color:rgba(255,255,255,.2)}
.btna{border-color:var(--acc);background:var(--acc-a);color:#a594ff;cursor:pointer}
.btna:hover{background:rgba(108,86,245,.3)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap}

/* ═══ SHELL: staircase sidebar + right panel ═══ */
#shell{flex:1;display:flex;min-height:0;overflow:hidden}

/* ── Staircase sidebar ── */
#stair-sb{width:196px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,opacity .2s ease}
#stair-sb.hidden{width:0;opacity:0;pointer-events:none;overflow:hidden}
.stair-logo{padding:14px 13px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.stair-logo-sq{width:26px;height:26px;background:var(--acc);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.stair-logo-txt{font-size:14px;font-weight:700;letter-spacing:-.3px}
.stair-logo-txt span{color:var(--teal)}
.stair-list{flex:1;overflow-y:auto;padding:8px 0 8px;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent}
/* Each step */
.stair-step{
  position:relative;display:flex;align-items:center;gap:9px;
  padding:9px 11px 9px 14px;margin:1px 0;
  border-left:3px solid transparent;
  border-radius:0 8px 8px 0;
  cursor:pointer;color:var(--text2);
  transition:transform .15s ease,background .12s,border-color .15s;
  background:transparent;
}
.stair-step:hover{background:var(--panel2);color:var(--text);transform:translateX(3px)}
.stair-step.on{
  background:var(--panel2);color:var(--text);font-weight:500;
  border-left-color:var(--sc,var(--acc));
  transform:translateX(6px);
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}
.step-sw{width:9px;height:9px;border-radius:3px;flex-shrink:0;transition:transform .15s}
.stair-step.on .step-sw{transform:scale(1.3)}
.step-txt{flex:1;min-width:0}
.step-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-sub{font-size:10px;color:var(--text3);margin-top:1px}
.step-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:rgba(255,79,110,.2);color:var(--red);flex-shrink:0}
.step-badge.ahead{background:rgba(0,212,173,.15);color:var(--teal)}
.stair-div{height:1px;background:var(--border);margin:6px 10px}
.stair-tools{padding:6px 0 8px;border-top:1px solid var(--border);flex-shrink:0}
.stair-tool{display:flex;align-items:center;gap:8px;padding:7px 13px;cursor:pointer;color:var(--text2);font-size:12px;border-left:3px solid transparent;transition:all .12s}
.stair-tool:hover{background:var(--panel2);color:var(--text)}
.stair-tool.on{background:var(--panel2);color:var(--text);font-weight:500;border-left-color:var(--acc)}

/* ── Right panel ── */
#right-panel{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#topbar{height:46px;background:var(--sb);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.tb-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.tb-meta{font-size:12px;color:var(--text2)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
/* Personal / Team toggle */
.view-toggle{display:flex;background:rgba(255,255,255,.04);border-radius:22px;padding:3px;gap:1px;border:1px solid var(--border);box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.vt-pill{border:none;background:transparent;color:var(--text3);font-size:11px;font-weight:600;padding:5px 13px;border-radius:18px;cursor:pointer;transition:all .18s cubic-bezier(.16,1,.3,1);letter-spacing:.02em}
.vt-pill.on{background:linear-gradient(135deg,var(--acc),#9b84ff);color:#fff;box-shadow:0 2px 10px rgba(124,99,248,.4);font-weight:700}
.name-chip{font-size:12px;background:var(--acc-a);color:#a594ff;padding:4px 11px;border-radius:20px;border:1px solid rgba(108,86,245,.3);cursor:pointer}
.name-chip:hover{background:rgba(108,86,245,.3)}

/* ── Slide transitions ── */
@keyframes slideFromRight{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideFromLeft{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:translateX(0)}}
.slide-in-right{animation:slideFromRight .22s cubic-bezier(.16,1,.3,1) both}
.slide-in-left{animation:slideFromLeft .22s cubic-bezier(.16,1,.3,1) both}

/* ═══ VIEW TABS (Gantt / Analytics / Behind / Upcoming) ═══ */
#view-tabs{height:36px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:stretch;padding:0 4px;flex-shrink:0;gap:1px}
.vt{padding:0 13px;border:none;background:none;font-size:12px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:5px}
.vt:hover{color:var(--text)}
.vt.on{color:var(--text);border-bottom-color:var(--acc);font-weight:500}
.vt-badge{border-radius:10px;padding:1px 5px;font-size:10px;line-height:1.4;color:#fff}

/* scope bar only shown in gantt view */
#scope-bar{height:34px;background:var(--sb);border-bottom:1px solid var(--border);display:flex;align-items:stretch;padding:0 4px;flex-shrink:0;gap:1px}
.scope-btn{
  padding:0 16px;border:none;background:none;font-size:13px;
  color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.scope-btn:hover{color:var(--text)}
.scope-btn.on{color:var(--text);border-bottom-color:var(--acc);font-weight:500}
.scope-badge{background:var(--acc);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px}
.scope-badge.red{background:var(--red)}
.scope-badge.amber{background:var(--amber)}
.scope-badge.teal{background:var(--teal)}
/* right of scope bar */
.scope-r{margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px}
.scope-r span{font-size:12px;color:var(--text2)}

/* ═══ MAIN GANTT ═══ */
#gwrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#gwrap-footer{flex-shrink:0;}

/* date header */
#dhead{height:56px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;flex-shrink:0;overflow:hidden}
.dh-stub{width:260px;flex-shrink:0;border-right:1px solid var(--border);display:flex;align-items:flex-end;padding:0 12px 7px;gap:8px}
.dh-stub-l{flex:1;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.dh-dates{flex:1;overflow:hidden;position:relative}
.mrow{position:absolute;top:0;left:0;right:0;height:22px;overflow:hidden}
.mblk{position:absolute;top:0;height:22px;display:flex;align-items:center;padding-left:8px;border-right:1px solid var(--border)}
.mblk .ml{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text2)}
.drow{position:absolute;top:22px;left:0;right:0;height:34px;overflow:hidden}
.dcol{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-right:1px solid var(--border);cursor:default}
.dcol .dn{font-size:13px;font-weight:700;color:var(--text2);line-height:1}
.dcol .dd{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.dcol.today-col{background:var(--today);border-radius:5px;margin:3px 2px;top:3px;bottom:3px;border:none}
.dcol.today-col .dn,.dcol.today-col .dd{color:#fff}
.dcol.scope-hi{background:rgba(108,86,245,.08);border-right-color:rgba(108,86,245,.15)}

/* body */
#gbody{flex:1;display:flex;min-height:0;overflow:hidden;max-height:calc(100% - 33px)}
/* a11y: gantt grid roles applied in JS */
.gbody-filler{flex:1;background:transparent}
/* ginner-fill removed — using dynRH fixed heights instead */
#gleft{width:260px;flex-shrink:0;border-right:1px solid var(--border);background:var(--sb);overflow-y:hidden;display:flex;flex-direction:column;min-height:100%}
/* gleft-fill removed */
.gl-head{height:32px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--border);flex-shrink:0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);gap:0}
.gl-r{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
.gl-r.me{background:rgba(108,86,245,.05)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0}
.gl-info{flex:1;min-width:0}
.gl-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-pct{font-size:10px;color:var(--text3);margin-top:1px}
.gl-stat{width:48px;flex-shrink:0;text-align:right;font-size:10px;font-weight:600}
.gl-stat.behind{color:var(--red)}
.gl-stat.ahead{color:var(--teal)}
.gl-stat.ok{color:var(--text3)}

#gscroll{flex:1;overflow:auto;position:relative}
#gscroll::-webkit-scrollbar{height:4px;width:4px}

/* grid + now line */
.gcol{position:absolute;top:0;bottom:0;border-right:1px solid var(--border);pointer-events:none}
.gcol.today-bg{background:rgba(108,86,245,.07);border-right-color:rgba(108,86,245,.3)}
.gcol.scope-bg{background:rgba(108,86,245,.04)}
.now-line{position:absolute;top:0;bottom:0;width:3px;background:var(--today);z-index:18;pointer-events:none;box-shadow:0 0 8px rgba(74,144,224,.7),0 0 20px rgba(74,144,224,.3)}
.now-line::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--today)}
.now-pill{position:absolute;top:-4px;left:0;transform:translateX(-50%);background:var(--today);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;pointer-events:none;z-index:19;box-shadow:0 2px 10px rgba(74,144,224,.5);letter-spacing:.02em}

/* teacher row */
.trow{position:relative;border-bottom:1px solid var(--border)}
.trow.me{background:rgba(108,86,245,.03)}
.trow:hover{background:rgba(255,255,255,.01)}
/* Ghost effect for peer rows in Personal mode */
.trow.peer-ghost{opacity:0.28;filter:saturate(0.3);transition:opacity .2s,filter .2s}
.trow.peer-ghost:hover{opacity:0.6;filter:saturate(0.6)}
.gl-r.peer-ghost{opacity:0.28;transition:opacity .2s}
.gl-r.peer-ghost:hover{opacity:0.6}

/* ─── BARS ─── */
.gbar{
  position:absolute;top:50%;transform:translateY(-50%);
  height:28px;border-radius:8px;cursor:grab;
  display:flex;align-items:center;overflow:hidden;white-space:nowrap;
  z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.4);user-select:none;
}
.gbar:hover{filter:brightness(1.1);box-shadow:0 3px 14px rgba(0,0,0,.6)}
.gbar.dragging{opacity:.88;z-index:60;box-shadow:0 6px 28px rgba(0,0,0,.7);cursor:grabbing}
/* ghost planned bar */
.gbar-plan{position:absolute;top:50%;transform:translateY(-50%);height:6px;border-radius:3px;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.12);pointer-events:none;z-index:3}
/* "should be" marker line */
.should-line{position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:rgba(255,255,255,.35);z-index:8;pointer-events:none}
.bar-inner{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;gap:5px;pointer-events:none}
.bar-lh,.bar-rh{position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
.bar-lh{left:0}
.bar-rh{right:0}
.bname{font-size:11px;font-weight:500;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis}
.bdur{font-size:10px;font-weight:700;background:rgba(0,0,0,.22);padding:1px 5px;border-radius:3px;color:rgba(255,255,255,.85);flex-shrink:0}
.bdelta{font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0}
.bdelta.ov{background:rgba(255,79,110,.3);color:#ff9aaa}
.bdelta.un{background:rgba(0,212,173,.25);color:var(--teal)}
.bsts{font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;flex-shrink:0}

/* ─── DETAIL PANEL ─── */
#dp{
  position:fixed;right:0;top:52px;bottom:0;width:290px;
  background:var(--panel2);border-left:1px solid var(--border2);
  z-index:100;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s ease;
  box-shadow:-4px 0 28px rgba(0,0,0,.6);
}
#dp.open{transform:translateX(0)}
#dp-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#dp-head h3{font-size:14px;font-weight:600}
#dp-x{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;line-height:1;padding:2px 6px}
#dp-x:hover{color:var(--text)}
#dp-body{flex:1;overflow-y:auto;padding:12px 14px}
.dp-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:10px 0 5px}
.dp-stat-card{background:var(--panel3);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;display:flex;flex-direction:column;gap:5px}
.dp-stat-row{display:flex;justify-content:space-between;align-items:center}
.dp-btn{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;background:transparent;color:var(--text2)}
.dp-btn:hover{background:var(--panel3);color:var(--text)}
.dp-btn.on-prog{background:rgba(255,176,64,.18);color:var(--amber);border-color:var(--amber)}
.dp-btn.on-taught{color:#fff;border-color:transparent}
.dp-sub{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.gap-btn{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);cursor:pointer;background:transparent;color:var(--text2)}
.gap-btn:hover{background:var(--panel3)}
.gap-btn.on{background:rgba(0,212,173,.15);color:var(--teal);border-color:var(--teal)}

/* tooltip */
.gtip{position:fixed;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;font-size:12px;pointer-events:none;z-index:200;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.7);line-height:1.6}

/* pages */
.page{flex:1;overflow-y:auto;padding:18px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:11px}
.sl{font-size:11px;color:var(--text2);margin-bottom:2px}
.sv{font-size:21px;font-weight:700}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.card.red{border-left:3px solid var(--red)}
.card.green{border-left:3px solid var(--teal)}
.card.gray{border-left:3px solid var(--text3)}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.atab{display:flex;gap:2px;background:var(--panel);border-radius:6px;padding:3px;margin-bottom:14px}
.atb{padding:4px 12px;border-radius:4px;border:none;font-family:inherit;font-size:12px;cursor:pointer;background:none;color:var(--text2)}
.atb.on{background:var(--panel2);font-weight:500;color:var(--text)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.modal{background:var(--panel2);border:1px solid var(--border2);border-radius:12px;padding:24px;width:340px;max-width:92vw}

/* ── Term progress bar ── */
.gl-prog-bg{height:4px;background:var(--panel3);border-radius:2px;margin-top:4px;overflow:hidden;width:100%}
.gl-prog-fill{height:100%;border-radius:2px;transition:width .3s ease}
/* ═══ BENTO DASHBOARD ═══ */
#dash-wrap{flex:1;overflow-y:auto;padding:0}
.dash-header{padding:28px 28px 0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
#dash-wrap .dash-inner{max-width:1300px;margin:0 auto;}
.dash-header-l h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.dash-header-l p{font-size:13px;color:var(--text2)}
.dash-align{text-align:right}
.dash-align .align-num{font-size:28px;font-weight:800;letter-spacing:-.5px}
.dash-align .align-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px 28px 28px}

/* Glass tiles with stagger animation */
@keyframes tileIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.y-tile{
  background:rgba(24,27,44,0.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;padding:20px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;min-height:180px;
  transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s ease,border-color .2s ease,background .2s;
  opacity:0;animation:tileIn .45s ease forwards;
}
.y-tile:hover{transform:translateY(-6px) scale(1.015);background:rgba(31,35,56,.88);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.y-tile:active{transform:scale(0.97);transition:transform .1s}
.y-tile.risk-glow::after{content:'';position:absolute;inset:0;border-radius:18px;box-shadow:0 0 22px var(--red);opacity:.1;pointer-events:none}
.y-tile::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--tc,transparent);opacity:.09;pointer-events:none}

.y-tile-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.y-num{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1}
.y-sub{font-size:11px;color:var(--text3);margin-top:3px}
.y-status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;flex-shrink:0}
.y-now{font-size:12px;font-weight:500;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.y-prog-track{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:10px}
.y-prog-fill{height:100%;border-radius:3px;transition:width .8s ease}
.y-avatars{display:flex;align-items:center;gap:0}
.y-av{width:22px;height:22px;border-radius:50%;border:2px solid rgba(24,27,44,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;font-weight:700;margin-left:-5px;flex-shrink:0}
.y-av:first-child{margin-left:0}
.y-av-more{font-size:9px;color:var(--text2);margin-left:5px}
/* welcome banner */
.dash-welcome{margin:16px 28px 0;padding:12px 16px;background:var(--acc-a);border:1px solid rgba(108,86,245,.25);border-radius:10px;display:flex;align-items:center;gap:10px}
.dash-welcome .dw-icon{font-size:20px;flex-shrink:0}
.dash-welcome .dw-text{font-size:13px;color:var(--text)}
.dash-welcome .dw-text strong{color:var(--acc)}
/* sort toggle */
.sort-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;padding:5px 11px;border:1px solid var(--border2);border-radius:20px;background:transparent;transition:all .12s}
.sort-toggle:hover{background:var(--panel2);color:var(--text)}
.sort-toggle.on{background:rgba(255,79,110,.12);border-color:rgba(255,79,110,.3);color:var(--red)}

/* ═══ SETUP WIZARD ═══ */
#setup-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;overflow-y:auto}
.setup-shell{max-width:680px;margin:0 auto;padding:40px 24px 60px;width:100%}
.setup-logo{font-size:22px;font-weight:800;margin-bottom:40px;letter-spacing:-.3px}
.setup-logo span{color:var(--teal)}
.setup-steps{display:flex;gap:0;margin-bottom:36px}
.setup-step-dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.setup-step-dot:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:1px;background:var(--border2)}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--sb);color:var(--text3);z-index:1;transition:all .2s}
.sdot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.sdot.active{background:var(--acc);border-color:var(--acc);color:#fff}
.sdot-lbl{font-size:10px;color:var(--text3);font-weight:600;white-space:nowrap;letter-spacing:.04em;text-align:center}
.auth-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.auth-card{background:var(--panel);border:1.5px solid var(--border2);border-radius:12px;padding:18px 14px;cursor:pointer;text-align:center;transition:all .15s}
.auth-card:hover{border-color:var(--acc);background:var(--panel2);transform:translateY(-2px)}
.auth-card.sel{border-color:var(--acc);background:rgba(108,86,245,.1)}
.auth-card-icon{font-size:26px;margin-bottom:8px}
.auth-card-name{font-size:13px;font-weight:700}
.auth-card-sub{font-size:11px;color:var(--text2);margin-top:3px}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.ai-card{background:var(--panel);border:1.5px solid var(--border2);border-radius:10px;padding:14px 12px;cursor:pointer;text-align:center;transition:all .15s}
.ai-card:hover{border-color:rgba(255,255,255,.2);background:var(--panel2)}
.ai-card.sel{border-color:var(--acc);background:rgba(108,86,245,.1)}
.ai-card-logo{font-size:22px}
.ai-card-name{font-size:13px;font-weight:700;margin-top:6px}
.ai-card-sub{font-size:10px;color:var(--text2);margin-top:2px}
.upload-zone{border:2px dashed var(--border2);border-radius:14px;padding:44px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--panel)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--acc);background:rgba(108,86,245,.06)}
.upload-zone input[type=file]{display:none}
.parsed-row{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:5px}
.parsed-num{font-size:10px;color:var(--text3);font-weight:700;width:28px;flex-shrink:0;text-align:right}
.parsed-name{flex:1;font-size:13px}
.parsed-wks{font-size:11px;color:var(--text2);white-space:nowrap;background:var(--panel2);padding:2px 8px;border-radius:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
.setup-nav{display:flex;gap:10px;margin-top:24px;align-items:center}
.sbtn-back{padding:10px 20px;border:1px solid var(--border2);border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;flex-shrink:0}
.sbtn-back:hover{background:var(--panel2);color:var(--text)}
.sbtn-next{padding:10px 0;border:none;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer;font-size:13px;font-weight:600;flex:1}
.sbtn-next:hover{background:#7d6af7}
.sbtn-next:disabled{opacity:.4;cursor:not-allowed}
.sbtn-skip{padding:10px 14px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:12px;flex-shrink:0}
.sbtn-skip:hover{color:var(--text2)}
.sfield{width:100%;padding:9px 12px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:13px}
.sfield:focus{outline:none;border-color:var(--acc)}

/* ── CURRICULUM EDITOR ── */
.ce-cell{min-width:42px;height:52px;border-radius:6px;border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .12s;font-size:10px;position:relative;padding:2px 3px;text-align:center;}
.ce-cell.ce-topic{background:color-mix(in srgb,var(--tc,var(--acc)) 70%,#000 30%);border-color:var(--tc,var(--acc));color:#fff;}
.ce-cell.ce-topic:hover{filter:brightness(1.15);}
.ce-cell.ce-cont{background:color-mix(in srgb,var(--tc,var(--acc)) 30%,transparent 70%);border-color:var(--tc,var(--acc))44;}
.ce-cell.ce-empty{background:rgba(255,255,255,.02);border-style:dashed;color:var(--text3);font-size:16px;}
.ce-cell.ce-empty:hover{background:rgba(108,86,245,.1);border-color:var(--acc);color:var(--acc);}
.ce-cell.ce-hol{background:rgba(255,176,64,.15);border-color:rgba(255,176,64,.3);color:var(--amber);font-size:9px;}

/* --- LIGHT MODE --- */
body.light{--bg:#f0f2f8;--sb:#fff;--panel:rgba(255,255,255,.92);--panel2:#f4f5fc;--panel3:#e8eaf4;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.15);--text:#1a1d2e;--text2:#5a607a;--text3:#9099b8;background:radial-gradient(ellipse 80% 60% at 80% 0%,#ddd8ff,#f0f2f8) !important}
body.light .y-tile{background:rgba(255,255,255,.85)}
body.light #stair-sb{background:#fff}
body.light #topbar,body.light #scope-bar,body.light #view-tabs{background:rgba(248,248,255,.95) !important}
@media print{
  body{background:#fff!important;color:#111!important}
  #stair-sb,#topbar,#view-tabs,#scope-bar,#dp,#mslot,.dash-welcome,#pdf-btn-bar{display:none!important}
  #right-panel,#content,#shell{overflow:visible!important;height:auto!important}
  .pdf-report{font-family:'Segoe UI',Arial,sans-serif;color:#111;padding:0}
  .pdf-page-break{page-break-before:always}
  .pdf-tile{break-inside:avoid}
}

/* ═══ MOBILE RESPONSIVE (< 640px) ═══ */
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:149;backdrop-filter:blur(2px)}
#sb-overlay.show{display:block}
#mob-bar{display:none;height:48px;background:var(--sb);border-bottom:1px solid var(--border);
  align-items:center;padding:0 12px;gap:10px;flex-shrink:0;position:relative;z-index:50}
.mob-logo{font-size:14px;font-weight:700;letter-spacing:-.3px;flex:1}
.mob-logo span{color:var(--teal)}
.mob-hamburger{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:transparent;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.mob-hamburger span{width:16px;height:2px;background:var(--text2);border-radius:1px;transition:all .2s}
/* Check-in mode card */
.checkin-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:12px 14px;overflow:hidden}
.checkin-card-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.checkin-card-name{font-size:16px;font-weight:700;margin-bottom:2px}
.checkin-card-sub{font-size:12px;color:var(--text2)}
.checkin-btns{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border)}
.ci-btn{padding:14px 10px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;border:none;background:transparent;border-right:1px solid var(--border);transition:background .12s}
.ci-btn:last-child{border-right:none}
.ci-btn:hover{background:var(--panel2)}
.ci-btn.ci-prog{color:var(--amber)}
.ci-btn.ci-done{color:var(--teal)}
.ci-btn.ci-none{color:var(--text3)}
.ci-btn.ci-active-prog{background:rgba(255,176,64,.12)}
.ci-btn.ci-active-done{background:rgba(0,212,173,.12)}
.ci-btn.ci-active-none{background:var(--panel2)}
@media(max-width:640px){
  #shell{flex-direction:column}
  #mob-bar{display:flex}
  #stair-sb{
    position:fixed;left:-220px;top:0;bottom:0;z-index:150;
    transition:transform .22s cubic-bezier(.16,1,.3,1);
    box-shadow:4px 0 24px rgba(0,0,0,.5);
  }
  #stair-sb.mob-open{transform:translateX(220px)}
  #right-panel{flex:1;overflow:hidden}
  #topbar{display:none}
  .dash-grid{grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .y-tile{min-height:140px;padding:14px}
  .y-num{font-size:22px}
  .dash-header{padding:16px 12px 0;gap:8px}
  .dash-header-l h1{font-size:18px}
  .dash-align .align-num{font-size:20px}
  #gleft{width:160px}
  .gl-r{padding:0 8px;gap:6px}
  .gl-stat{width:36px;font-size:10px}
  .av{width:26px;height:26px;font-size:9px}
  .gl-name{font-size:11px}
}

/* ─── SMART ALERTS ─── */
.alert-bar{display:flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(255,79,110,.09);border-bottom:1px solid rgba(255,79,110,.2);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.alert-bar::-webkit-scrollbar{display:none}
.alert-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;transition:background .12s;border:1px solid transparent}
.alert-chip.red{background:rgba(255,79,110,.14);color:var(--red);border-color:rgba(255,79,110,.25)}
.alert-chip.amber{background:rgba(255,176,64,.12);color:var(--amber);border-color:rgba(255,176,64,.22)}
.alert-chip.blue{background:rgba(74,144,224,.12);color:var(--blue);border-color:rgba(74,144,224,.22)}
.alert-chip:hover{filter:brightness(1.15)}
/* ─── INTERVENTION ─── */
.int-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;background:rgba(255,176,64,.2);color:var(--amber);border:1px solid rgba(255,176,64,.3)}
.int-btn{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid rgba(255,176,64,.3);background:transparent;color:var(--amber);cursor:pointer;transition:all .12s}
.int-btn:hover{background:rgba(255,176,64,.15)}
.int-btn.flagged{background:rgba(255,176,64,.2);color:var(--amber)}
/* ─── NOTE TYPES ─── */
.note-type-bar{display:flex;gap:5px;margin-bottom:6px}
.ntb{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text3)}
.ntb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ntb.warn.on{background:var(--red);border-color:var(--red)}
.ntb.info.on{background:var(--blue);border-color:var(--blue)}
.ntb.done.on{background:var(--teal);border-color:var(--teal)}
/* ═══ TODAY VIEW ═══════════════════════════════════════ */
#today-root{
  background:var(--bg);
  min-height:100%;
  overflow-y:auto;
  padding-bottom:100px;
}
/* Sticky greeting header */
.tv-header{
  position:sticky;top:0;z-index:50;
  background:var(--sb);
  border-bottom:1px solid var(--border);
  padding:14px 16px 12px;
}
.tv-greeting{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px;}
.tv-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.tv-status-strip{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:10px;
  font-size:12px;font-weight:600;
}
.tv-status-strip.good{background:rgba(0,212,173,.1);color:var(--teal);}
.tv-status-strip.warn{background:rgba(255,176,64,.1);color:var(--amber);}
.tv-status-strip.bad{background:rgba(255,79,110,.1);color:var(--red);}
/* Card */
.tv-card{
  margin:12px 14px 0;
  background:var(--panel);
  border:1px solid var(--border);
  border-left:4px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  transition:box-shadow .2s,border-left-color .2s;
}
.tv-card:hover{box-shadow:0 6px 28px rgba(0,0,0,.4);}
.tv-card.tv-behind{border-left-color:var(--red);}
.tv-card.tv-ontrack{border-left-color:var(--acc);}
.tv-card.tv-ahead{border-left-color:var(--teal);}
.tv-card.tv-complete{border-left-color:var(--teal);opacity:.7;}
.tv-card-accent{height:3px;width:100%;opacity:.7;}
.tv-card-head{
  padding:14px 16px 0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
}
.tv-cls-name{font-size:16px;font-weight:800;letter-spacing:-.3px;}
.tv-pct-badge{
  font-size:13px;font-weight:800;
  padding:4px 10px;border-radius:20px;
  background:var(--panel2);
  flex-shrink:0;
}
.tv-behind-chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;
  margin-top:4px;
}
.tv-topic-block{padding:12px 16px 0;}
.tv-topic-eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:4px;
}
.tv-topic-name{font-size:17px;font-weight:700;line-height:1.3;margin-bottom:3px;}
.tv-topic-meta{font-size:12px;color:var(--text3);margin-bottom:14px;}
/* Progress bar */
.tv-prog-wrap{height:5px;background:var(--panel2);margin:0 16px;border-radius:3px;overflow:hidden;}
.tv-prog-fill{height:100%;border-radius:3px;transition:width .5s ease;}
/* Action buttons */
.tv-actions{display:flex;gap:8px;padding:12px 16px;}
.tv-act-btn{
  flex:1;padding:11px 8px;
  border-radius:12px;border:2px solid var(--border);
  background:var(--panel2);
  color:var(--text2);font-size:12px;font-weight:600;
  cursor:pointer;text-align:center;
  transition:all .18s;
}
.tv-act-btn:hover{filter:brightness(1.1);transform:translateY(-1px);}
.tv-act-btn.is-active{border-color:transparent;color:#fff;}
.tv-act-btn.is-active-none{background:var(--panel3);border-color:var(--border2);color:var(--text);}
.tv-act-btn.is-active-prog{background:rgba(255,176,64,.18);border-color:var(--amber);color:var(--amber);}
/* Note row */
.tv-note-wrap{padding:0 16px 14px;}
.tv-note-input{
  width:100%;padding:8px 11px;
  background:var(--panel2);
  border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-size:12px;font-family:inherit;
  box-sizing:border-box;resize:none;
  transition:border-color .15s;
}
.tv-note-input:focus{outline:none;border-color:var(--acc);}
.tv-note-input::placeholder{color:var(--text3);}
/* Feedback toast */
.tv-feedback{
  margin:12px 14px 0;
  padding:10px 14px;
  background:rgba(0,212,173,.1);
  border:1px solid rgba(0,212,173,.25);
  border-radius:12px;
  font-size:13px;font-weight:600;color:var(--teal);
  display:flex;align-items:center;gap:8px;
}
/* Done card */
.tv-done-card{
  margin:12px 14px 0;
  padding:16px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  display:flex;align-items:center;gap:12px;
  opacity:.6;
}
/* Bottom snapshot */
.tv-snapshot{padding:20px 16px 0;}
.tv-snap-title{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.tv-snap-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.tv-snap-label{font-size:12px;font-weight:500;width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;}
.tv-snap-bar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;}
.tv-snap-fill{height:100%;border-radius:3px;}
.tv-snap-pct{font-size:11px;font-weight:700;width:32px;text-align:right;flex-shrink:0;}
/* Full view toggle (bottom-right FAB) */
.tv-fab{
  position:fixed;bottom:24px;right:20px;
  background:var(--panel2);border:1px solid var(--border2);
  border-radius:20px;padding:8px 16px;
  font-size:12px;font-weight:600;color:var(--text2);
  cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:6px;
  transition:all .18s;z-index:100;
}
.tv-fab:hover{background:var(--panel3);color:var(--text);}
/* Just-taught undo strip */
.tv-just-taught{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;
  background:rgba(0,212,173,.06);
  border-bottom:1px solid rgba(0,212,173,.12);
  gap:10px;
}
.tv-just-taught-label{font-size:12px;color:var(--teal);font-weight:600;flex:1;}
.tv-undo-btn{
  font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;
  background:none;border:1px solid rgba(0,212,173,.25);
  color:var(--teal);cursor:pointer;white-space:nowrap;
  transition:all .15s;
}
.tv-undo-btn:hover{background:rgba(0,212,173,.12);}

/* Inline suggestion on card */
.tv-suggestion{
  margin:0 16px 10px;
  padding:8px 11px;
  background:rgba(255,176,64,.07);
  border:1px solid rgba(255,176,64,.18);
  border-radius:8px;
  font-size:11px;
  color:var(--amber);
  display:flex;align-items:flex-start;gap:7px;
}
.tv-suggestion-icon{flex-shrink:0;font-size:13px;}

/* Intervention strip */
.tv-interv{
  margin:12px 14px 0;
  padding:12px 14px;
  background:rgba(255,79,110,.08);
  border:1px solid rgba(255,79,110,.2);
  border-radius:12px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;

  if(!raw||typeof raw!=='object') return {};
  const out={};

    if(typeof name!=='string'||!name.trim()) return;

        if(typeof tid!=='string') return;
        const status=Config.status.all.includes(p?.status)?p.status:Config.status.NONE;
        const as_=Number.isInteger(p?.actualStart)&&p.actualStart>=1&&p.actualStart<=Config.maxWeeks?p.actualStart:null;
        const ae_=Number.isInteger(p?.actualEnd)&&p.actualEnd>=1&&p.actualEnd<=Config.maxWeeks?p.actualEnd:null;
        progress[tid]={status,actualStart:as_,actualEnd:ae_,early:!!p?.early};
      });
    }
    const gaps=Array.isArray(teacher.gaps)?teacher.gaps.filter(g=>g&&typeof g.topicId==='string'&&Config.gaps.includes(g.type)):[];
    const notes=teacher.notes&&typeof teacher.notes==='object'?teacher.notes:{};
    out[name.substring(0,60)]={name:name.substring(0,60),progress,gaps,notes};
  });
  return out;
}

function validateCls(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(cls=>{
    if(!cls||typeof cls!=='object') return false;
    if(!cls.id||!cls.name||!Array.isArray(cls.topics)) return false;
    cls.topics=cls.topics.filter(t=>
      t&&typeof t.id==='string'&&typeof t.name==='string'&&
      Number.isInteger(t.start)&&Number.isInteger(t.end)&&
      t.start>=1&&t.end<=Config.maxWeeks&&t.start<=t.end
    );
    return true;
  });
}

/* ════ API / SYNC MODULE ═══════════════════════════════════
   When a backend URL is configured, progress is synced
   to the server. Falls back to localStorage if offline.
   Backend: https://github.com/dmventures/lessonflow-api
═══════════════════════════════════════════════════════════ */
const API = {
  _url: localStorage.getItem('lf_api_url') || '',
  _tok: localStorage.getItem('lf_api_token') || '',

  configured() { return !!(this._url && this._tok); },

  headers() {
    return {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + this._tok
    };
  },

  setConfig(url, token) {
    this._url = url.replace(/\/+$/, '');
    this._tok = token;
    localStorage.setItem('lf_api_url', this._url);
    localStorage.setItem('lf_api_token', this._tok);
  },

  async login(email, password) {
    const r = await fetch(this._url + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    this._tok = data.token;
    localStorage.setItem('lf_api_token', this._tok);
    return data;
  },

  async register(name, email, password, school_name) {
    const r = await fetch(this._url + '/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password, school_name, role:'hod'})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Registration failed');
    this._tok = data.token;
    localStorage.setItem('lf_api_token', this._tok);
    return data;
  },

  // Push local state to server (called after every setSts/savNoteTyped)
  async push(name) {
    if (!this.configured()) return;
    const teacher = T[name];
    if (!teacher) return;
    try {
      await fetch(this._url + '/api/sync/push', {
        method: 'POST',
        headers: this.headers(),
        body: JSON.stringify({
          progress: teacher.progress || {},
          notes: teacher.notes || {}
        })
      });
    } catch (e) {
      console.warn('LessonFlow: offline, will sync later');
      // Queue for later (stored in localStorage as pending)
      const q = JSON.parse(localStorage.getItem('lf_sync_q') || '[]');
      q.push({name, ts: Date.now()});
      localStorage.setItem('lf_sync_q', JSON.stringify(q.slice(-20)));
    }
  },

  // Pull full school state from server
  async pull() {
    if (!this.configured()) return null;
    try {
      const r = await fetch(this._url + '/api/sync/pull', { headers: this.headers() });

      // ── Handle 402 — school needs Pro plan ──────────────
      if (r.status === 402) {
        const data = await r.json().catch(()=>({}));
        this._showUpgradePrompt(data);
        return null;
      }

      if (!r.ok) return null;
      const data = await r.json();

      // ── Smart merge — timestamp-based conflict resolution ─
      // Local record wins if newer. Server wins if newer.
      // Never overwrite local data with empty server data.
      if (data.T) {
        Object.entries(data.T).forEach(([name, serverState]) => {
          if (!T[name]) T[name] = {progress:{}, notes:{}};

          // Merge progress — record-by-record
          Object.entries(serverState.progress || {}).forEach(([topicId, serverProg]) => {
            const localProg = T[name].progress[topicId];

            if (!localProg || localProg.status === 'none') {
              // No local data — take server
              T[name].progress[topicId] = serverProg;
            } else if (!serverProg || serverProg.status === 'none') {
              // No server data — keep local
              // (teacher has local progress not yet synced)
            } else {
              // Both have data — use timestamps to resolve
              const localTs  = localProg.updatedAt  || 0;
              const serverTs = serverProg.updatedAt  || 0;
              if (serverTs > localTs) {
                T[name].progress[topicId] = serverProg;
              }
              // else keep local (it's newer)
            }
          });

          // Merge notes — same logic
          Object.entries(serverState.notes || {}).forEach(([topicId, serverNote]) => {
            const localNote = T[name].notes?.[topicId];
            if (!localNote?.text) {
              T[name].notes[topicId] = serverNote;
            }
            // else keep local note
          });
        });
        savT();
      }
      return data;
    } catch (e) {
      console.warn('LessonFlow: pull failed, using local data');
      return null;
    }
  },

  // ── Show upgrade prompt when server returns 402 ─────────
  _showUpgradePrompt(data) {
    const existing = document.getElementById('upgrade-modal');
    if (existing) return; // don't show twice

    const msg = data.message || 'Multi-teacher sync requires a Pro school licence.';
    const url  = data.upgrade_url || 'https://lessonflow.co.uk/pricing';

    const m = document.createElement('div');
    m.id = 'upgrade-modal';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(8px);';
    m.innerHTML = `<div style="background:var(--panel);border:1px solid var(--border2);border-radius:16px;padding:32px;max-width:440px;width:90%;text-align:center;">
      <div style="font-size:48px;margin-bottom:16px;">⭐</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:8px;">Pro plan required</div>
      <div style="font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6;">\${msg}</div>
      <div style="background:var(--panel2);border-radius:10px;padding:16px;margin-bottom:20px;text-align:left;">
        <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:8px;">LessonFlow Pro — £299/school/year</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.8;">
          ✓ Multi-teacher sync<br>
          ✓ HoD department dashboard<br>
          ✓ Retrieval question bank (dept-wide)<br>
          ✓ Stuck warning & intervention tools<br>
          ✓ SLT report PDF<br>
          ✓ 30-day free trial included
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <button onclick="document.getElementById('upgrade-modal').remove()"
          style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--border2);background:none;color:var(--text2);font-size:13px;cursor:pointer;">
          Continue offline
        </button>
        <a href="\${url}" target="_blank"
          style="flex:2;padding:11px;border-radius:10px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;">
          Upgrade to Pro →
        </a>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:12px;">Your local data is safe and will sync once upgraded.</div>
    </div>`;
    m.onclick = e => { if(e.target===m) m.remove(); };
    document.body.appendChild(m);
  },

  // Pull scheme from server (replaces localStorage scheme)
  async pullScheme() {
    if (!this.configured()) return null;
    try {
      const r = await fetch(this._url + '/api/schemes', { headers: this.headers() });
      if (!r.ok) return null;
      const scheme = await r.json();
      if (!scheme) {
        if (getRole() === 'teacher') showToast('⚠ Your HoD hasn\'t set up the curriculum yet.');
        return null;
      }
      // Only replace local curriculum if server has real classes with topics
      const serverClasses = (scheme.classes || []).filter(cls => cls && cls.topics && cls.topics.length > 0);
      if (serverClasses.length === 0) {
        console.log('LessonFlow: server scheme empty — keeping local curriculum');
        return null;
      }
      // Safe to replace — server has real data
      scheme.classes = serverClasses;
      try { localStorage.setItem('lf_pd', JSON.stringify({term:scheme.term||scheme.name, weeks:scheme.weeks||40, classes:serverClasses})); } catch(e) {}
      // Convert DB format → PD format
      PD.term = scheme.term || scheme.name;
      PD.weeks = scheme.weeks || 40;
      if (scheme.classes) {
        PD.classes = scheme.classes.map(c => ({
          id: c.id, name: c.name, color: c.color,
          topics: (c.topics || []).map(t => ({
            id: t.id, name: t.name, start: t.start_week, end: t.end_week
          }))
        }));
      }
      return scheme;
    } catch (e) {
      return null;
    }
  }
};

async function generateQuestions(topicName,clsName,topicId,btnEl){
  if(btnEl){btnEl.textContent='\u23f3 Generating...';btnEl.classList.add('loading');btnEl.disabled=true;}
  try{
    const cfg=JSON.parse(localStorage.getItem('lf_cfg')||'{}');

    if(cfg.provider==='claude'&&cfg.apiKey){
      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':cfg.apiKey,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({model:'claude-haiku-20240307',max_tokens:200,
          messages:[{role:'user',content:'Generate exactly 3 short UK secondary maths retrieval starter questions for "'+topicName+'" ('+clsName+'). Just 3 questions, one per line, no numbering, concise.'}]})
      });
      const d=await res.json();
      if(d.content&&d.content[0]) qs=d.content[0].text.split('\n').filter(q=>q.trim()).slice(0,3);
    }
    if(!qs.length) qs=_fallbackQs(topicName);
    saveQuestions(topicId,qs);
    renderToday();
  }catch(e){
    const qs=_fallbackQs(topicName);
    saveQuestions(topicId,qs);
    renderToday();
  }
}

function _fallbackQs(t){
  const n=t.toLowerCase();
  if(n.includes('fraction')) return ['What is \u00be + \u00bd?','Simplify 8/12 to its lowest terms.','What is \u2154 of 36?'];
  if(n.includes('algebra')||n.includes('equation')) return ['Solve: 3x + 5 = 14','Expand: 2(x + 4)','Find x if 2x = 18'];
  if(n.includes('area')||n.includes('perimeter')) return ['Area of a rectangle 6cm \u00d7 4cm?','Perimeter of a square with side 5cm?','Formula for area of a triangle?'];
  if(n.includes('trig')) return ['What does SOH CAH TOA stand for?','sin(30\u00b0) = ?','Find \u03b8 if tan(\u03b8) = 1'];
  if(n.includes('probab')) return ['P(red) if bag has 3 red, 2 blue balls?','What does probability 0 mean?','Sum of all probabilities in a sample space?'];
  if(n.includes('ratio')||n.includes('proportion')) return ['Simplify 12:8','If 3:5 = x:20, find x','Share \u00a340 in ratio 3:5'];
  if(n.includes('percent')) return ['What is 20% of 150?','Express 0.35 as a percentage.','A shirt costs \u00a340 after 20% off. Original price?'];
  if(n.includes('pythag')) return ['State Pythagoras\u2019s theorem.','Hypotenuse if sides are 3 and 4cm?','Is 5, 12, 13 a right triangle?'];
  if(n.includes('circle')) return ['Formula for circumference of a circle?','Area of circle radius 7cm (\u03c0\u22483.14)?','Diameter if radius = 5cm?'];
  if(n.includes('sequence')||n.includes('nth')) return ['Next term: 2, 5, 8, 11, \u2026?','nth term of: 3, 7, 11, 15, \u2026?','Is 45 in the sequence 4n \u2212 1?'];
  if(n.includes('statistic')||n.includes('mean')||n.includes('average')) return ['Mean of: 4, 7, 9, 2, 8?','Median of: 3, 5, 7, 9, 11?','Range of: 12, 7, 19, 4, 15?'];
  return ['Explain '+t+' in one sentence.','Give an example from last lesson.','What was most challenging about this topic?'];
}

      if(e.key==='d'||e.key==='D'){SIMPLE_MODE=false;localStorage.setItem('lf_simple','0');DASH=true;render();}
    }
    if(e.key==='Escape'){closeDp();if(SETUP){SETUP=false;const _ov2=document.getElementById('setup-overlay');if(_ov2)_ov2.style.display='none';render();}}
  });
  // seedDemo() removed — app starts clean
  // Show setup on first run (no config saved yet)
  const hasConfig=!!localStorage.getItem(CFG_KEY);
  if(!hasConfig){SETUP=true;SETUP_STEP=1;}
  else if(!U) MODAL=true;
  render();
})();

function seedDemo(){
  const cw=getCW();
  DEMO.forEach((name,ti)=>{
    T[name]={name,progress:{},gaps:[]};
    PD.classes.forEach(cls=>{
      cls.topics.forEach(t=>{
        const off=[-1,0,1,2][ti];
        const ew=Math.max(1,cw+off);
        let st='none';
        if(t.end<ew) st='taught';
        else if(t.start<=ew&&t.end>=ew) st='progress';
        if(st!=='none'){
          const as=Math.max(1,t.start+(ti%2?-1:0));
          const ae=st==='taught'?Math.min(40,t.end+(ti===1?1:ti===3?2:0)):null;
          T[name].progress[t.id]={status:st,early:ti===0&&st==='taught',actualStart:as,actualEnd:ae};
        }
      });
    });
  });
  savT();
}

}

function shareURL(name){
  if(!T[name]) return;
  const b64=btoa(JSON.stringify(T[name]));

  navigator.clipboard.writeText(url).then(()=>{

    if(d&&d.name){T[d.name]=d;savT();history.replaceState(null,'',location.pathname);showToast(d.name+' imported from link.');}
  }catch(e){}
}

async function pickLocalFolder(){

  try{

async function saveToLocalFolder(){
  if(!_fsHandle) return;
  try{
    const data={T,U,CUSTOM,timestamp:new Date().toISOString(),term:PD.term};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const fh=await _fsHandle.getFileHandle('lessonflow-data.json',{create:true});
    const w=await fh.createWritable();
    await w.write(blob); await w.close();
  }catch(e){console.warn('FS save failed:',e);}
}
async function loadFromLocalFolder(){
  if(!_fsHandle) return;
  try{
    const fh=await _fsHandle.getFileHandle('lessonflow-data.json');
    const file=await fh.getFile();
    const data=JSON.parse(await file.text());
    if(data.T) T=data.T;

    if(data.CUSTOM) CUSTOM=data.CUSTOM;
    savT(); savC();
    showToast('Loaded data from '+_fsHandle.name);
    render();
  }catch(e){console.warn('FS load failed:',e);}
}

/* CE helpers */
function ceTglHol(w){
  const i=CE.holidays.indexOf(w);
  if(i>-1) CE.holidays.splice(i,1); else CE.holidays.push(w);
  renderCurricEditor();
}
function ceDragStart(e,tid){CE.dragging=tid;}
function ceDrop(e,targetWeek){
  if(!CE.dragging) return;
  const cls=CE.cls, t=cls.topics.find(x=>x.id===CE.dragging);
  if(!t) return;
  const dur=t.end-t.start;
  t.start=targetWeek; t.end=targetWeek+dur;
  CE.dragging=null; ceRelayout(); renderCurricEditor();
}
function ceRename(tid,val){
  if(!CE.cls)return;
  const t=CE.cls.topics.find(x=>x.id===tid);
  if(t) t.name=val.trim();
}
function ceSetDur(tid,delta){
  if(!CE.cls)return;
  const cls=CE.cls, idx=cls.topics.findIndex(x=>x.id===tid);
  const t=cls.topics[idx];
  const newDur=Math.max(1,t.end-t.start+1+delta);
  t.end=t.start+newDur-1;
  ceRelayout(); renderCurricEditor();
}
function ceMoveUp(i){
  if(!CE.cls)return;
  const ts=CE.cls.topics;
  if(i<1) return;
  [ts[i-1],ts[i]]=[ts[i],ts[i-1]];
  ceRelayout(); renderCurricEditor();
}
function ceMoveDown(i){
  if(!CE.cls)return;
  const ts=CE.cls.topics;
  if(i>=ts.length-1) return;
  [ts[i],ts[i+1]]=[ts[i+1],ts[i]];
  ceRelayout(); renderCurricEditor();
}
function ceDeleteTopic(tid){
  if(!CE.cls)return;
  CE.cls.topics=CE.cls.topics.filter(x=>x.id!==tid);
  ceRelayout(); renderCurricEditor();
}
function ceAddTopic(startWeek){
  const cls=CE.cls;
  const lastEnd=cls.topics.length?cls.topics[cls.topics.length-1].end:0;
  const sw=startWeek||lastEnd+1;
  cls.topics.push({id:cls.id+'_'+Date.now(),name:'New topic',start:sw,end:sw});
  ceRelayout(); renderCurricEditor();
}
function ceRelayout(){
  // Reflow topic start/end so they don't overlap, respecting holidays
  const cls=CE.cls, hols=CE.holidays;
  let w=1;
  cls.topics.forEach(t=>{
    const dur=t.end-t.start+1;
    // Skip holiday weeks
    while(hols.includes(w)) w++;
    t.start=w;
    let ww=w, placed=0;
    while(placed<dur){if(!hols.includes(ww)){placed++;}ww++;}
    t.end=ww-1; w=ww;
  });
}
function saveCurric(){
  // Save back to PD.classes and persist
  const cls=CE.cls;
  const idx=PD.classes.findIndex(c2=>c2.id===cls.id);
  if(idx>-1) PD.classes[idx]=cls;
  // Persist custom curriculum
  try{
    const sol=PD.classes.filter(c2=>c2._custom||CE.cls.id===c2.id);
    cls._custom=true;
    localStorage.setItem(SOL_KEY,JSON.stringify(sol));
  }catch(e){}
  showToast('Curriculum saved and applied to all teacher pages.');
  goY(cls.id);
}
function ceImportFromExcel(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async e=>{
    const file=e.target.files[0];if(!file) return;
    try{
      const text=await readSpreadsheet(file);
      showToast('File read. Configure AI on step 2 of Setup to auto-extract topics, or enter them manually.');
    }catch(err){showToast('Could not read file: '+err.message);}
  };
  inp.click();
}

function getStrands(clsId){try{const all=JSON.parse(localStorage.getItem(STRAND_KEY)||'{}');return all[clsId]||[];}catch(e){return [];}}
function saveStrands(clsId,strands){try{const all=JSON.parse(localStorage.getItem(STRAND_KEY)||'{}');all[clsId]=strands;localStorage.setItem(STRAND_KEY,JSON.stringify(all));}catch(e){}}
function getTopicStrand(clsId,topicId){if(!clsId) return null;
  return getStrands(clsId).find(s=>s.topicIds&&s.topicIds.includes(topicId))||null;}
function addStrand(clsId,name){const strands=getStrands(clsId);const id='s_'+Date.now();strands.push({id,name:name.trim(),color:STRAND_COLORS[strands.length%STRAND_COLORS.length],topicIds:[]});saveStrands(clsId,strands);return id;}
function removeStrand(clsId,strandId){saveStrands(clsId,getStrands(clsId).filter(s=>s.id!==strandId));}
function assignTopicToStrand(clsId,topicId,strandId){
  const strands=getStrands(clsId);
  strands.forEach(s=>{s.topicIds=(s.topicIds||[]).filter(id=>id!==topicId);});
  if(strandId){const t=strands.find(s=>s.id===strandId);if(t)t.topicIds=[...(t.topicIds||[]),topicId];}
  saveStrands(clsId,strands);
}

function getRoster(){try{return JSON.parse(localStorage.getItem(ROSTER_KEY))||[];}catch(e){return [];}}

function addTeacherToRoster(name,role,email){
  if(!name.trim()) return;
  const r=getRoster();
  if(r.find(x=>x.name===name)){showToast('Teacher already in roster.');return;}
  r.push({name:name.trim(),role:role||'teacher',email:email||'',classes:allCls().map(c=>c.id),added:new Date().toISOString()});
  savRoster(r);
  // Auto-create T entry
  if(!T[name.trim()]){T[name.trim()]={name:name.trim(),progress:{},gaps:[]};savT();}
  renderRoster();
  showToast(name+' added to roster.');
}

function removeTeacherFromRoster(name){
  if(!confirm('Remove '+name+' from the roster? Their progress data will be kept.')) return;
  const r=getRoster().filter(x=>x.name!==name);
  savRoster(r);
  renderRoster();
}

/* ════════════════════════════════════════════════════════

════════════════════════════════════════════════════════ */
function getCal(){try{return JSON.parse(localStorage.getItem(CAL_KEY))||{};}catch(e){return {};}}
function savCal(d){try{localStorage.setItem(CAL_KEY,JSON.stringify(d));}catch(e){}}

function applyCalendarToWeekDates(termStart, holidayWeeks){
  // Rebuild PD.weekDates from term start + holiday offsets
  const start=new Date(termStart);
  let weekNum=0, calWeek=0;
  const newDates={};
  for(let day=new Date(start); day<new Date(start.getTime()+60*7*24*60*60*1000); day.setDate(day.getDate()+7)){
    calWeek++;
    if(holidayWeeks.includes(calWeek)) continue; // skip holidays
    weekNum++;
    if(weekNum>40) break;
    newDates[String(weekNum)]=day.toISOString().slice(0,10);
  }
  if(Object.keys(newDates).length>=10){
    PD.weekDates=newDates;
    savCal({termStart, holidayWeeks});
    showToast('Calendar updated — '+Object.keys(newDates).length+' teaching weeks configured.');
    render();
  } else {
    showToast('Too few weeks found. Check your start date.');
  }
}

function renderCalendar(){
  const co=document.getElementById('content');
  co.style.overflowY='auto';
  const cal=getCal();
  const termStart=cal.termStart||Object.values(PD.weekDates)[0]||'2025-09-01';
  const holidayWeeks=cal.holidayWeeks||[];

  // Build a preview grid of calendar weeks
  const start=new Date(termStart);
  const weeks=[];
  for(let i=0;i<52;i++){
    const d=new Date(start.getTime()+i*7*24*60*60*1000);
    weeks.push({calWeek:i+1, date:d.toISOString().slice(0,10),

const _calHolState={termStart:'',holidays:[]};
function toggleCalHoliday(calWeek, termStart){
  const cal=getCal();
  const hols=[...( cal.holidayWeeks||[])];
  const idx=hols.indexOf(calWeek);
  if(idx>-1) hols.splice(idx,1); else hols.push(calWeek);
  savCal({termStart:termStart||cal.termStart, holidayWeeks:hols});
  renderCalendar();
}
function applyCalendar(){
  const start=document.getElementById('cal-start')?.value;
  if(!start){showToast('Enter a start date.');return;}
  const cal=getCal();
  applyCalendarToWeekDates(start, cal.holidayWeeks||[]);
}
function loadCalPreset(preset){
  const start=document.getElementById('cal-start')?.value||'2025-09-01';
  let hols=[];
  if(preset==='uk-standard') hols=[6,7,14,15,19,20,28,29,35,36,42,43]; // half-terms + xmas + easter
  if(preset==='uk-secondary') hols=[6,7,14,15,20,21,28,29,34,35,42,43,48,49];
  if(preset==='trimester') hols=[7,8,9,18,19,20,29,30,31];
  savCal({termStart:start, holidayWeeks:hols});
  renderCalendar();
}

function printGantt(){
  const cls=getCls(YID)||(()=>{
    // YID not found — reset to first available class
    const first=allCls()[0];
    if(first){YID=first.id; return first;}
    return null;
  })();
  if(!cls&&!DASH) return;
  const cw=getCW(), tn=Ts();
  const WW=32; // print column width px
  const TW=PD.weeks*WW;

  // Month headers
  const wks=Array.from({length:PD.weeks},(_,i)=>i+1);
  const months={};
  wks.forEach((w,i)=>{const ms=wMonthStr(w);if(!months[ms])months[ms]={start:i,count:0};months[ms].count++;});
  const mHdr=Object.entries(months).map(([m,v])=>`<div style="position:absolute;left:${v.start*WW}px;width:${v.count*WW}px;height:20px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;overflow:hidden;border-right:1px solid #ddd;padding:3px 4px;color:#555;">${m}</div>`).join('');
  const wHdr=wks.map((w,i)=>{const isToday=w===cw;return `<div style="position:absolute;left:${i*WW}px;width:${WW}px;height:18px;font-size:8px;text-align:center;color:${isToday?'#6c56f5':'#999'};font-weight:${isToday?700:400};border-right:1px solid #eee;">${w}</div>`;}).join('');
  const todayX=(cw-1)*WW+WW/2;
  const todayLine=`<div style="position:absolute;left:${todayX}px;top:0;bottom:0;width:1.5px;background:#6c56f5;opacity:.6;z-index:10;"></div>`;

  const rows=cls.topics.map((topic,ti)=>{
    const isNow=topic.start<=cw&&topic.end>=cw;
    const px=(topic.start-1)*WW, pw=(topic.end-topic.start+1)*WW-2;
    // Plan bar
    const planBar=`<div style="position:absolute;left:${px}px;width:${pw}px;height:8px;top:14px;border-radius:3px;background:#e8e8ff;border:1px solid #c0b8ff;"></div>`;
    // Teacher bars
    const tBars=tn.map((name,ni)=>{
      const pp=T[name]?.progress?.[topic.id]||{};
      const sts=pp.status||'none'; if(sts==='none') return '';
      const as_=pp.actualStart||topic.start, ae_=pp.actualEnd||topic.end;
      const bx=(as_-1)*WW, bw=Math.max((ae_-as_+1)*WW-2,4);
      const by=24+ni*8;
      const col=sts==='taught'?cls.color:sts==='progress'?cls.color+'88':'#ffb040';
      return `<div style="position:absolute;left:${bx}px;width:${bw}px;height:7px;top:${by}px;border-radius:2px;background:${col};"></div>`;
    }).join('');
    const rowH=24+tn.length*8+6;
    return `<tr><td style="padding:3px 8px;font-size:10px;font-weight:${isNow?700:400};color:${isNow?'#6c56f5':'#333'};white-space:nowrap;border-bottom:1px solid #f0f0f0;width:200px;">${ti+1}. ${topic.name}</td>
      <td style="padding:0;border-bottom:1px solid #f0f0f0;">
        <div style="position:relative;height:${rowH}px;width:${TW}px;">${todayLine}${planBar}${tBars}</div>
      </td></tr>`;
  }).join('');

  const legend=tn.map(n=>`<span style="display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:10px;"><span style="width:14px;height:6px;border-radius:2px;background:${avCol(n)};display:inline-block;"></span>${n}</span>`).join('');

  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>LessonFlow Gantt — ${cls.name}</title>
  <style>
    body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:#111;margin:0;padding:0}
    .page{padding:20px 16px}
    h1{font-size:18px;font-weight:800;margin:0 0 4px}
    .meta{font-size:11px;color:#666;margin-bottom:14px}
    table{border-collapse:collapse;width:100%}
    .month-hdr{position:relative;height:20px;margin-left:200px;overflow:hidden;border-bottom:2px solid #333;}
    .week-hdr{position:relative;height:18px;margin-left:200px;overflow:hidden;border-bottom:1px solid #ddd;margin-bottom:0;}
    .legend{padding:10px 0;font-size:10px;border-top:1px solid #eee;margin-top:10px;}
    .plan-key{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:10px;}
    @media print{@page{margin:10mm;size:A3 landscape}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style></head>
  <body><div class="page">
    <h1>LessonFlow — ${cls.name} Gantt Chart</h1>
    <div class="meta">${PD.term} · Week ${cw} · ${wLabel(cw)} · ${tn.length} teacher${tn.length!==1?'s':''} · Generated ${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="month-hdr" style="width:${TW+200}px;"><div style="position:absolute;left:0;width:200px;height:20px;"></div>${mHdr.replace(/left:/g,'left:calc(200px + ')}</div>
    <div class="week-hdr" style="width:${TW+200}px;"><div style="position:absolute;left:0;width:200px;height:18px;font-size:9px;padding:3px 8px;color:#888;font-weight:700;">TOPIC</div>${wHdr.replace(/left:/g,'left:calc(200px + ')}</div>
    <table><tbody>${rows}</tbody></table>
    <div class="legend">
      <span class="plan-key"><span style="width:14px;height:6px;background:#e8e8ff;border:1px solid #c0b8ff;display:inline-block;border-radius:2px;"></span>Planned</span>
      ${legend}
      <span style="color:#6c56f5;font-weight:700;margin-left:6px;">│ Today (W${cw})</span>
    </div>
  </div>
  \u003cscript\u003ewindow.onload=()=>window.print();\u003c/script\u003e
  </body></html>`;

  const win=window.open('','_blank','width=1100,height=700');
  if(win){win.document.write(html);win.document.close();}
  else showToast('Allow pop-ups to print the Gantt.');
}


/* ════ BUILT-IN TEST SUITE ═══════════════════════════════
   Run from Settings page or call runTests() in console.
   Tests core utility functions for regression safety.
═══════════════════════════════════════════════════════════ */
function runTests(){
  const results=[];
  function assert(name,val,expected){
    const pass=JSON.stringify(val)===JSON.stringify(expected);
    results.push({name,pass,got:val,expected});
    return pass;
  }
  function test(name,fn){try{fn();}catch(e){results.push({name,pass:false,got:e.message,expected:'no error'});}}

  const fakeCls={id:'t',name:'Test',color:'#fff',topics:[
    {id:'t1',name:'Topic 1',start:1,end:2},
    {id:'t2',name:'Topic 2',start:3,end:4},
    {id:'t3',name:'Topic 3',start:6,end:8},
  ]};
  const fakeName='TestTeacher';
  const savedT=JSON.parse(JSON.stringify(T));

  test('topicAt: finds current topic',()=>{
    assert('topicAt week 1',topicAt(fakeCls,1)?.id,'t1');
    assert('topicAt week 3',topicAt(fakeCls,3)?.id,'t2');
    assert('topicAt week 5',topicAt(fakeCls,5),null); // holiday week
    assert('topicAt week 6',topicAt(fakeCls,6)?.id,'t3');
    assert('topicAt week 9',topicAt(fakeCls,9),null); // after last
  });

  test('pct: calculates taught percentage',()=>{
    T[fakeName]={name:fakeName,progress:{t1:{status:'taught'},t2:{status:'progress'}},gaps:[]};
    assert('pct 1/3 taught',pct(fakeName,fakeCls),33);
    T[fakeName].progress.t3={status:'taught'};
    assert('pct 2/3 taught',pct(fakeName,fakeCls),67);
    delete T[fakeName];
    assert('pct no data',pct('unknown',fakeCls),0);
  });

  test('wksBehind: detects behind schedule',()=>{
    T[fakeName]={name:fakeName,progress:{},gaps:[]};
    assert('wksBehind at w1 no data',wksBehind(fakeName,fakeCls,1),0);
    assert('wksBehind at w3 (t1 overdue)',wksBehind(fakeName,fakeCls,3),0); // w3=start of t2, t1 ends w2
    T[fakeName].progress.t1={status:'taught'};
    assert('wksBehind t1 taught at w5',wksBehind(fakeName,fakeCls,5),0);
    delete T[fakeName];
  });

  test('validateT: strips invalid entries',()=>{
    const raw={validName:{name:'validName',progress:{t1:{status:'taught',actualStart:1,actualEnd:2}},gaps:[]},
      badStatus:{name:'badStatus',progress:{t1:{status:'INVALID'}},gaps:[]},
      '':null, nullEntry:null};
    const v=validateT(raw);
    assert('validateT: keeps valid',!!v.validName,true);
    assert('validateT: fixes bad status',v.badStatus.progress.t1.status,'none');
    assert('validateT: drops empty key',!!v[''],false);
    assert('validateT: drops null entry',!!v.nullEntry,false);
  });

  test('validateCls: sanitises class array',()=>{
    const raw=[
      {id:'y7',name:'Year 7',color:'#fff',topics:[{id:'t1',name:'T',start:1,end:2}]},
      null,
      {id:'bad',name:'Bad',color:'#fff',topics:[{id:'x',name:'X',start:50,end:60}]}, // out of range
      {id:'noTopics',name:'NT',color:'#fff'}, // missing topics array
    ];
    const v=validateCls(raw);
    assert('validateCls keeps valid',v.length,1); // only y7
    assert('validateCls keeps topics',v[0].topics.length,1);
  });

  test('esc: sanitises XSS strings',()=>{
    assert('esc basic html','\u003cscript\u003e'.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])),'&lt;script&gt;');
    assert('escAttr strips quotes',escAttr('bad<>"name'),esc('bad<>"name'));
  });

  T=savedT; // restore

  // Show results
  const passed=results.filter(r=>r.pass).length;
  const failed=results.filter(r=>!r.pass);
  const pct2=Math.round(passed/results.length*100);
  const summary=`${passed}/${results.length} tests passed (${pct2}%)`;
  console.group('LessonFlow Test Suite — '+summary);
  results.forEach(r=>console[r.pass?'log':'error']((r.pass?'✅':'❌')+' '+r.name+(r.pass?'':' → got: '+JSON.stringify(r.got)+', expected: '+JSON.stringify(r.expected))));
  console.groupEnd();
  return {passed,failed,total:results.length,summary,ok:failed.length===0};
}

function renderToday(){

  if(window._tvWeekOffset===undefined) window._tvWeekOffset=0;
  const cw=Math.max(1,Math.min(PD.weeks,getCW()+window._tvWeekOffset)), classes=allCls();

  if(!U){
    co.style.overflowY='auto';

      <div style="font-size:56px;margin-bottom:16px;">👋</div>

    </div>`;
    return;
  }

  // ── Compute status across all classes ──
  const behindClasses=classes.filter(cls=>wksBehind(U,cls,cw)>0);

  const totalBehindWks=behindClasses.reduce((s,cls)=>s+wksBehind(U,cls,cw),0);

  let headerStatus,headerStatusClass;
  if(behindClasses.length>=2){
    headerStatus=`⚠ You're behind in ${behindClasses.length} classes — here's what needs attention`;
    headerStatusClass='bad';
  } else if(behindClasses.length===1){
    headerStatus=`⚠ Slightly behind in ${behindClasses[0].name}`;
    headerStatusClass='warn';
  } else if(aheadClasses.length>0){
    headerStatus=`🌟 You're ahead of schedule — great work`;
    headerStatusClass='good';

    headerStatus=`✓ On track across all classes`;
    headerStatusClass='good';

    return t&&T[U]?.progress?.[t.id]?.status&&T[U].progress[t.id].status!=='none';
  }).length;

  // ── Build cards ──
  const cards=classes.map((cls,ci)=>{

    const justTaught=nowTaught?nowT:null; // for the "undo" strip

    const pctCol=myPct>=80?'var(--teal)':myPct>=50?'var(--amber)':'var(--red)';

/* ════ DATE HELPERS ════ */
function getCW(){
  if(!PD.weekDates) return 1;
  const t=new Date().toISOString().slice(0,10); let w=1;
  Object.entries(PD.weekDates).forEach(([k,v])=>{if(v<=t)w=Math.max(w,+k);});
  return w;
}
function wDate(w){return PD.weekDates[String(w)]?new Date(PD.weekDates[String(w)]):null;}
function wLabel(w,f){const d=wDate(w);if(!d)return '';return d.toLocaleDateString('en-GB',f||{day:'numeric',month:'short'});}
function wDayNum(w){const d=wDate(w);return d?d.getDate():'';}
function wDayName(w){const d=wDate(w);return d?d.toLocaleDateString('en-GB',{weekday:'short'}).toUpperCase():'';}
function wMonthStr(w){const d=wDate(w);return d?d.toLocaleDateString('en-GB',{month:'short',year:'2-digit'}).toUpperCase():'';}
function todayStr(){return new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}

// Scope → week range (±3 weeks window around target week)
function scopeWeek(){
  const cw=getCW();
  if(SCOPE==='prev') return cw-1;
  if(SCOPE==='next') return cw+1;
  if(SCOPE==='should') return cw; // same position, just different highlight
  return cw;
}
function scopeWindow(){
  const sw=scopeWeek(), total=PD.weeks;
  const half=8; // show 8 weeks either side
  return {from:Math.max(1,sw-half), to:Math.min(total,sw+half), focus:sw};
}

function gp(name,tid){
  if(!T[name])T[name]={name,progress:{},gaps:[]};
  if(!T[name].progress[tid])T[name].progress[tid]={status:'none',early:false,actualStart:null,actualEnd:null};
  return T[name].progress[tid];
}
function hg(n,tid,type){return (T[n]?.gaps||[]).some(g=>g.topicId===tid&&g.type===type);}


/* ════ VELOCITY CHECK ═════════════════════════════════════
   Auto-detects when a teacher is stuck on a topic.
   If 'in progress' for > planned weeks → flags for HoD.
   Runs silently on every render — no manual action needed.
════════════════════════════════════════════════════════ */
function checkStuck(name, cls, cw){
  if(!T[name]||!cls) return [];
  const flags=[];
  cls.topics.forEach(t=>{
    const p=T[name].progress?.[t.id];
    if(!p||p.status!=='progress') return;
    const plannedDuration=t.end-t.start+1;
    const started=p.actualStart||t.start;
    const weeksInProgress=cw-started;
    // Flag if they've been in progress for longer than the planned duration
    if(weeksInProgress>plannedDuration){
      flags.push({
        topic:t,
        weeksOverdue:weeksInProgress-plannedDuration,
        plannedDuration
      });
    }
  });
  return flags;
}

function getStuckAlerts(cw){
  // Returns all velocity issues across all teachers and classes
  const alerts=[];
  Ts().forEach(name=>{
    allCls().forEach(cls=>{
      const flags=checkStuck(name,cls,cw);
      flags.forEach(f=>{
        alerts.push({name,cls,topic:f.topic,weeksOverdue:f.weeksOverdue});
      });
    });
  });
  return alerts;
}

/* ════ DEPARTMENTAL QUESTION BANK ════════════════════════
   HoD pre-writes the best retrieval questions per topic.
   All teachers see these instead of AI/fallback questions.
   Stored in localStorage as lf_deptqs = {topicId: [q1,q2,q3]}
════════════════════════════════════════════════════════ */
const DEPTQS_KEY='lf_deptqs';
function getDeptQuestions(topicId){
  try{return JSON.parse(localStorage.getItem(DEPTQS_KEY)||'{}')[topicId]||[];}catch(e){return [];}
}
function saveDeptQuestions(topicId, qs){
  try{
    const all=JSON.parse(localStorage.getItem(DEPTQS_KEY)||'{}');
    all[topicId]=qs.filter(q=>q.trim());
    localStorage.setItem(DEPTQS_KEY,JSON.stringify(all));
  }catch(e){}
}
function getEffectiveQuestions(topicId){
  // Dept bank takes priority, then teacher's own, then generate
  const dept=getDeptQuestions(topicId);
  if(dept.length) return {qs:dept, source:'dept'};
  const own=getQuestions(topicId);
  if(own.length) return {qs:own, source:'own'};
  return {qs:[], source:'none'};
}

/* ════ EFFECTIVE DATES — single source of truth ══════════
   Always call this instead of topic.start/topic.end when
   you want "where is this teacher actually up to?"
═══════════════════════════════════════════════════════════ */
function getEffectiveDates(topic, name){
  const p=T[name]?.progress?.[topic.id];
  return {
    start: p?.actualStart ?? topic.start,
    end:   p?.actualEnd   ?? topic.end
  };
}

/* ════ computeClassStatus() — central status computer ════
   One call gives you everything about a teacher's class.
   All views should use this instead of ad-hoc calculations.
═══════════════════════════════════════════════════════════ */
function computeClassStatus(name, cls, cw){
  if(!cls||!name) return {behind:0,ahead:0,pct:0,currentTopic:null,missedTopics:[],status:'ok'};
  const topics=cls.topics;
  const taught=t=>T[name]?.progress?.[t.id]?.status==='taught';
  const inProg=t=>T[name]?.progress?.[t.id]?.status==='progress';

  // Missed: past topics that were never taught
  const missedTopics=topics.filter(t=>t.end<cw&&!taught(t));

  // Current planned topic
  const currentTopic=topicAt(cls,cw);

  // Progress %
  const pctVal=topics.length?Math.round(topics.filter(taught).length/topics.length*100):0;

  // Behind: last thing taught/in-progress is behind the planned topic
  const lastActive=topics.slice().reverse().find(t=>taught(t)||inProg(t));
  let behind=0;
  if(currentTopic&&(!lastActive||lastActive.end<currentTopic.start)){
    behind=currentTopic.start-(lastActive?lastActive.end:0);
  }

  // Ahead: last taught is ahead of planned
  const lastTaught=topics.slice().reverse().find(taught);
  let ahead=0;
  if(currentTopic&&lastTaught&&lastTaught.start>currentTopic.end){
    ahead=lastTaught.start-currentTopic.end;
  }

  const statusKey=missedTopics.length>2?'critical':behind>0?'behind':ahead>0?'ahead':'ok';
  return {behind,ahead,pct:pctVal,currentTopic,missedTopics,status:statusKey};
}

/* Auto-detect 'missed' status for past topics */
function autoTagMissed(){
  const cw=getCW();
  Ts().forEach(name=>{
    if(!T[name]) return;
    allCls().forEach(cls=>{
      cls.topics.forEach(t=>{
        const p=gp(name,t.id);
        if(t.end<cw&&p.status==='none'){
          p.status='missed';
        }
        // Un-miss if they've now taught it
      });
    });
  });
  savT();
}
function topicAt(cls,w){return cls.topics.find(t=>t.start<=w&&t.end>=w)||null;}
function pct(name,cls){
  const tot=cls.topics.length; if(!tot)return 0;
  return Math.round(cls.topics.filter(t=>T[name]?.progress?.[t.id]?.status==='taught').length/tot*100);
}
function wksBehind(name,cls,cw){
  const pl=topicAt(cls,cw); if(!pl) return 0;
  const lt=cls.topics.slice().reverse().find(t=>T[name]?.progress?.[t.id]?.status==='taught');
  const lp=cls.topics.find(t=>T[name]?.progress?.[t.id]?.status==='progress');
  const ac=lp||lt; if(!ac||ac.id===pl.id) return 0;
  if(ac.end<pl.start) return pl.start-ac.end;
  return 0;
}
function wksAhead(name,cls,cw){
  // Taught topics further ahead than planned
  const pl=topicAt(cls,cw); if(!pl) return 0;
  const lastT=cls.topics.slice().reverse().find(t=>T[name]?.progress?.[t.id]?.status==='taught');
  if(!lastT) return 0;
  if(lastT.end>pl.end) return lastT.end-pl.end;
  return 0;
}
